<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>模範病院稽查</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
  :root{
    --room:#23261f;
    --shell:#cec8b6;
    --shell-hi:#e3ddcc;
    --shell-lo:#a9a390;
    --shell-edge:#7e7866;
    --plate:#8d2f28;
    --ink:#2a281f;
    --btn-a:#7e3430;
    --btn-b:#474a44;
    --btn-lo:#31332e;
    --bezel:#2c3028;
    --led:#c4453a;
    --screen-on:#1b1725;
  }
  html,body{height:100%;overscroll-behavior:none;}
  body{
    margin:0;background:
      radial-gradient(120% 80% at 50% 0%, #34382e 0%, var(--room) 60%, #16180f 100%);
    color:var(--shell-hi);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    box-sizing:border-box;
    /* 左右一定要留出「手勢安全帶」：手機的返回手勢感應區大約是邊緣 24～32px，
       按鍵只要落在裡面，玩家按方向鍵就會不小心把整頁滑掉。 */
    padding:8px 24px;
    padding:8px max(clamp(20px,7vw,32px),env(safe-area-inset-right,0px))
            8px max(clamp(20px,7vw,32px),env(safe-area-inset-left,0px));
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  }
  *{-webkit-tap-highlight-color:transparent;}

  /* 機身 8:16（1:2），比手機再瘦一點，讓按鍵離螢幕邊緣夠遠；螢幕另外維持 4:3 */
  .cab{
    container-type:inline-size;
    width:min(100%,430px,calc((100vh - 20px) * 0.5));
    width:min(100%,430px,calc((100svh - 20px) * 0.5));
    aspect-ratio:8/16;
    display:flex;flex-direction:column;gap:2cqw;
    box-sizing:border-box;
    padding:clamp(9px,3.4vw,15px) clamp(9px,3.4vw,15px) clamp(11px,4vw,18px);
    background:linear-gradient(168deg,var(--shell-hi) 0%,var(--shell) 30%,var(--shell-lo) 100%);
    border-radius:4cqw 4cqw 13cqw 4cqw;
    border:1px solid var(--shell-edge);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      inset 0 -3px 6px rgba(0,0,0,.22),
      0 18px 34px rgba(0,0,0,.5);
  }

  .plate{
    display:flex;align-items:center;gap:2cqw;flex:0 0 auto;
    font-size:2.5cqw;letter-spacing:.14em;color:var(--ink);opacity:.85;
  }
  .plate .tag{
    background:var(--plate);color:#f3e7dc;
    padding:.6cqw 1.6cqw;border-radius:2px;letter-spacing:.2em;font-weight:700;
  }
  .plate .rule{flex:1;height:1px;background:var(--shell-edge);opacity:.5;}

  .screenbox{
    position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#333729,#22261c);
    border-radius:2.5cqw 2.5cqw 6cqw 2.5cqw;
    padding:4cqw 3.6cqw 6.2cqw;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.4);
  }
  .screenbox .mark{
    position:absolute;left:3.8cqw;bottom:1.6cqw;
    font-size:2cqw;letter-spacing:.24em;color:#8d9482;
  }
  .screenbox .led{
    position:absolute;right:3.8cqw;bottom:1.9cqw;width:1.6cqw;height:1.6cqw;border-radius:50%;
    background:var(--led);box-shadow:0 0 6px 1px rgba(196,69,58,.8);
  }
  .silk{
    flex:0 0 auto;text-align:center;
    font-size:2.2cqw;letter-spacing:.22em;color:var(--ink);opacity:.45;
  }

  .screen{
    position:relative;aspect-ratio:4/3;width:100%;
    background:var(--screen-on);border-radius:2px;overflow:hidden;
    box-shadow:inset 0 0 12px rgba(25,35,27,.45);
  }
  .screen canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .screen .scan{
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(to bottom,rgba(12,9,22,.16) 0 1px,transparent 1px 3px);
    opacity:.4;
  }

  /* 單色螢幕上唯一的紅：印泥 */
  .stamp{
    position:absolute;z-index:4;right:5%;bottom:5%;
    width:26%;aspect-ratio:1;border-radius:50%;
    display:none;place-items:center;
    color:#a5312a;border:3px double #a5312a;
    font-weight:900;letter-spacing:.06em;line-height:1.15;text-align:center;
    font-size:clamp(10px,2.9vw,14px);
    transform:rotate(-13deg);opacity:.88;mix-blend-mode:multiply;
  }
  .stamp.show{display:grid;animation:slam .42s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp b{display:block;font-size:.72em;letter-spacing:.24em;font-weight:700;opacity:.8;}
  @keyframes slam{
    0%{transform:rotate(-30deg) scale(2.6);opacity:0;}
    70%{transform:rotate(-11deg) scale(.94);opacity:.95;}
    100%{transform:rotate(-13deg) scale(1);opacity:.88;}
  }
  @media (prefers-reduced-motion:reduce){ .stamp.show{animation:none;} }

  .ctrl{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;}
  /* 機身變窄了，按鍵的 cqw 一併調大，實際按起來的大小跟原本一樣；
     padding 加寬則是再把方向鍵往內推，遠離手勢感應區。 */
  .pad{display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 2cqw;}
  /* max() 是實體下限：小螢幕手機上 cqw 算出來會小到不好按，至少要撐住 34／44px */
  .dpad{display:grid;grid-template-columns:repeat(3,max(12.5cqw,34px));grid-template-rows:repeat(3,max(12.5cqw,34px));}
  .key{
    border:0;padding:0;margin:0;touch-action:none;cursor:pointer;
    background:linear-gradient(170deg,#4d5049,#2b2d28);
    color:#cdc8b8;font-size:3.2cqw;display:grid;place-items:center;
    box-shadow:0 2px 0 var(--btn-lo),0 3px 5px rgba(0,0,0,.35);
  }
  .key.on{transform:translateY(2px);box-shadow:0 0 0 var(--btn-lo),0 1px 3px rgba(0,0,0,.4);filter:brightness(1.2);}
  .dpad .key{width:max(12.5cqw,34px);height:max(12.5cqw,34px);}
  .dpad .u{grid-area:1/2;border-radius:1.6cqw 1.6cqw 0 0;}
  .dpad .l{grid-area:2/1;border-radius:1.6cqw 0 0 1.6cqw;}
  .dpad .c{grid-area:2/2;background:#3a3d37;box-shadow:inset 0 0 4px rgba(0,0,0,.6);}
  .dpad .r{grid-area:2/3;border-radius:0 1.6cqw 1.6cqw 0;}
  .dpad .d{grid-area:3/2;border-radius:0 0 1.6cqw 1.6cqw;}

  .ab{display:flex;align-items:center;gap:3.6cqw;transform:rotate(-16deg);}
  .round{width:max(16cqw,44px);height:max(16cqw,44px);border-radius:50%;font-size:4.6cqw;font-weight:900;font-family:"Press Start 2P",monospace;}
  .round.a{background:linear-gradient(170deg,#9c4741,var(--btn-a));color:#f0dcd6;box-shadow:0 3px 0 #4e211e,0 4px 7px rgba(0,0,0,.4);}
  .round.b{background:linear-gradient(170deg,#5c605a,var(--btn-b));color:#dcd9cf;box-shadow:0 3px 0 #2a2c28,0 4px 7px rgba(0,0,0,.4);}
  .round.on{transform:translateY(3px);}
  .ab .b{margin-top:5cqw;}

  .sys{display:flex;justify-content:center;gap:5cqw;}
  .pill{
    width:19cqw;height:4.6cqw;border-radius:2.6cqw;transform:rotate(-16deg);
    font-size:2.3cqw;letter-spacing:.16em;font-weight:700;color:#d6d2c6;
  }

  .grille{display:flex;gap:2.2cqw;justify-content:flex-end;padding-right:3cqw;transform:rotate(-24deg);transform-origin:right center;}
  .grille i{
    display:block;width:1.5cqw;height:10cqw;border-radius:1cqw;
    background:linear-gradient(180deg,#a49e8c,#bdb7a5);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.5);
  }

  .foot{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2cqw;
    font-size:2.4cqw;letter-spacing:.1em;color:var(--ink);opacity:.72;min-height:5cqw;
  }
  .share{
    border:1px solid var(--shell-edge);background:rgba(255,255,255,.35);
    color:var(--ink);font-family:inherit;font-size:2.5cqw;letter-spacing:.1em;
    padding:1cqw 2.4cqw;border-radius:3px;cursor:pointer;display:none;
  }
  .share.show{display:block;}
  .share:active{background:rgba(255,255,255,.6);}
  .snd{
    border:1px solid var(--shell-edge);background:rgba(255,255,255,.35);
    color:var(--ink);font-family:inherit;font-size:2.5cqw;letter-spacing:.1em;
    padding:1cqw 2.4cqw;border-radius:3px;cursor:pointer;flex:0 0 auto;
  }
  .snd[aria-pressed="true"]{opacity:.45;}
  .snd:active{background:rgba(255,255,255,.6);}
  .foot .cap{flex:1;text-align:center;}
  .key:focus-visible,.share:focus-visible,.snd:focus-visible{outline:2px solid #d8b24a;outline-offset:2px;}
  .foot.done .cap{display:none;}
  /* 結尾時兩顆按鈕要夠大、夠顯眼：分享是主按鈕，名冊是次要；音樂鈕留在左邊不動 */
  .foot.done .snd{margin-right:auto;}
  .foot.done .share{
    font-size:3.4cqw;font-weight:700;letter-spacing:.08em;
    padding:0 3.2cqw;min-height:max(10cqw,40px);border-radius:1.6cqw;
    box-shadow:0 2px 0 var(--shell-edge);
  }
  .foot.done #share{background:var(--plate);border-color:#6d231d;color:#f3e7dc;box-shadow:0 2px 0 #4e211e;}
  .foot.done #share:active{filter:brightness(1.12);}

  /* ── 結尾的稽查員名冊：蓋在遊戲螢幕上的真 HTML 表單（才叫得出手機鍵盤與自動填入）。
     螢幕只有約 170～220px 高，整張表塞不下，所以一次只問一題，永遠不必捲動。
     .over 自己是尺寸容器，裡面的 cqw 都是「螢幕寬的百分比」，直式、橫式 GBA 一樣適用。 ── */
  .over{
    position:absolute;inset:0;z-index:6;
    container-type:size;
    background:linear-gradient(180deg,#f2ead6,#e6dcc3);
    color:#2a281f;
    padding:4% 6%;box-sizing:border-box;overflow:hidden;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-user-select:auto;user-select:auto;
  }
  .over form{height:100%;}
  .over .step{height:100%;display:none;flex-direction:column;justify-content:center;gap:3.2cqw;}
  .over .step.on{display:flex;}
  .over .top{
    display:flex;justify-content:space-between;align-items:center;
    font-size:max(4cqw,10px);letter-spacing:.14em;
    border-bottom:1px solid #8d2f28;padding-bottom:1.2cqw;
  }
  .over .top span{opacity:.7;}
  .over .top button{
    border:0;background:none;padding:0 0 0 2cqw;cursor:pointer;
    font:inherit;letter-spacing:.06em;color:#8d2f28;
  }
  .over h3{
    margin:0;font-size:6.4cqw;letter-spacing:.2em;text-align:center;font-weight:900;
    padding-bottom:1.6cqw;border-bottom:2px solid #8d2f28;
  }
  .over .why{margin:0;font-size:max(4.6cqw,11px);line-height:1.6;opacity:.8;text-align:center;}
  .over .q{margin:0;font-size:max(5.4cqw,12px);line-height:1.35;font-weight:900;}
  .over .note{margin:0;font-size:max(4cqw,10px);line-height:1.5;opacity:.65;}
  /* 字級一定要 16px：低於 16px 時 iOS Safari 會在聚焦輸入框時自動放大整頁 */
  .over input{
    font-family:inherit;font-size:16px;line-height:1.2;padding:6px 8px;width:100%;box-sizing:border-box;
    border:1px solid #9c937c;border-radius:3px;background:#fbf7ec;color:#2a281f;
  }
  .over .err{margin:0;min-height:1.3em;font-size:max(4cqw,10px);color:#9c2f28;}
  .over .row{display:flex;gap:3cqw;}
  .over .row button{
    flex:1;font-family:inherit;font-weight:700;font-size:max(4.8cqw,12px);letter-spacing:.06em;
    min-height:max(13cqw,30px);padding:0;border-radius:3px;cursor:pointer;
    border:1px solid #9c937c;background:#fbf7ec;color:#2a281f;
  }
  .over .row .go{background:var(--plate);border-color:#6d231d;color:#f3e7dc;}
  .over .row button:active{filter:brightness(.92);}
  .over .row button:disabled{opacity:.6;}
  .over .thanks{text-align:center;}
  .over .thanks b{font-size:6.4cqw;letter-spacing:.2em;}

  /* ════════ 橫拿手機：整台變成 GBA 造型的橫式掌機（機身 16:8） ════════
     方向鍵在左、螢幕置中、AB 在右、START／SELECT 在左下、喇叭孔在右下。
     限定 max-height:600px，這樣只有手機橫放會變身；桌機與平板仍是直式 GAMEBOY。
     機身比例固定 16:8，所以 1cqh 正好等於 0.5cqw，下面的尺寸都用 cqw 寫，
     不必改成 container-type:size（避免相容性風險）。 */
  @media (orientation:landscape) and (max-height:600px){
    body{
      padding:6px 20px;
      padding:6px max(clamp(20px,4vw,40px),env(safe-area-inset-right,0px))
              6px max(clamp(20px,4vw,40px),env(safe-area-inset-left,0px));
    }
    .cab{
      width:min(100%,900px,calc((100vh - 16px) * 2));
      width:min(100%,900px,calc((100svh - 16px) * 2));
      aspect-ratio:16/8;
      display:grid;
      grid-template-columns:auto 1fr auto;
      grid-template-rows:auto 1fr auto auto;
      /* 螢幕跨第二、三列，把整片中央的高度都吃下來 */
      grid-template-areas:
        "plate  plate   plate"
        "dpad   screen  ab"
        "sys    screen  grille"
        "foot   foot    foot";
      align-items:center;
      gap:0.8cqw 1.6cqw;
      padding:1.6cqw 2.4cqw 1.8cqw;
      border-radius:6cqw/13cqw;
    }
    /* 直式的包裝層在橫式用不到，讓它的小孩直接變成 grid 項目 */
    .ctrl,.pad{display:contents;}
    .silk{display:none;}

    .plate{grid-area:plate;font-size:1.3cqw;gap:1cqw;}
    .plate .tag{padding:.3cqw .8cqw;}

    .screenbox{
      grid-area:screen;align-self:stretch;justify-self:center;
      display:grid;place-items:center;
      padding:1.6cqw 1.8cqw 2.8cqw;
      border-radius:1.4cqw 1.4cqw 3cqw 1.4cqw;
    }
    .screen{height:100%;width:auto;aspect-ratio:4/3;}
    .screenbox .mark{left:1.9cqw;bottom:.7cqw;font-size:1cqw;}
    .screenbox .led{right:1.9cqw;bottom:.85cqw;width:.8cqw;height:.8cqw;}

    .dpad{grid-area:dpad;justify-self:center;
      grid-template-columns:repeat(3,max(5.6cqw,34px));grid-template-rows:repeat(3,max(5.6cqw,34px));}
    .dpad .key{width:max(5.6cqw,34px);height:max(5.6cqw,34px);}
    .key{font-size:1.6cqw;}
    .dpad .u{border-radius:.8cqw .8cqw 0 0;}
    .dpad .l{border-radius:.8cqw 0 0 .8cqw;}
    .dpad .r{border-radius:0 .8cqw .8cqw 0;}
    .dpad .d{border-radius:0 0 .8cqw .8cqw;}

    .ab{grid-area:ab;justify-self:center;gap:1.8cqw;transform:rotate(-10deg);}
    .round{width:max(7.2cqw,44px);height:max(7.2cqw,44px);font-size:2.1cqw;}
    .ab .b{margin-top:2.4cqw;}

    .sys{grid-area:sys;flex-direction:column;align-items:center;gap:.7cqw;}
    .pill{width:9cqw;height:2.2cqw;border-radius:1.3cqw;font-size:1.1cqw;transform:rotate(-10deg);}

    .grille{grid-area:grille;padding-right:1cqw;gap:1.1cqw;transform:rotate(-20deg);}
    .grille i{width:.75cqw;height:4cqw;border-radius:.5cqw;}

    .foot{grid-area:foot;font-size:1.2cqw;min-height:0;}
    .share,.snd{font-size:1.2cqw;padding:.5cqw 1.2cqw;}
    .foot.done .share{font-size:1.7cqw;padding:0 1.6cqw;min-height:max(4.2cqw,34px);border-radius:.8cqw;}
  }
</style>

<div class="cab">
  <div class="plate">
    <span class="tag">臺灣省衛生處</span>
    <span class="rule"></span>
    <span>病院稽查機　59-A</span>
  </div>

  <div class="screenbox">
    <div class="screen">
      <canvas id="cv" width="256" height="192" aria-label="模範病院稽查遊戲畫面"></canvas>
      <div class="scan"></div>
      <div class="stamp" id="stamp"></div>

      <!-- 結尾的稽查員名冊：一次一題（說明 → email → 稱呼 → 要不要收消息 → 完成） -->
      <div class="over" id="sub" hidden>
        <form id="subf" novalidate>
          <div class="step">
            <h3>稽查員名冊</h3>
            <p class="why">明日之家若有新的稽查任務，<br>會寄一份派令給你。</p>
            <p class="note" style="text-align:center">共三題，十秒填完。</p>
            <div class="row">
              <button type="button" data-act="skip">稍後再說</button>
              <button type="button" data-act="next" class="go">登記</button>
            </div>
          </div>
          <div class="step">
            <div class="top"><span>稽查員名冊　1／3</span></div>
            <p class="q">派令要寄到哪裡？</p>
            <input id="em" type="email" inputmode="email" autocomplete="email" enterkeyhint="next"
                   placeholder="you@example.com" spellcheck="false" aria-label="Email">
            <p class="err" id="er" role="alert"></p>
            <div class="row">
              <button type="button" data-act="back">上一步</button>
              <button type="button" data-act="next" class="go">下一步</button>
            </div>
          </div>
          <div class="step">
            <div class="top"><span>稽查員名冊　2／3</span></div>
            <p class="q">怎麼稱呼你？</p>
            <input id="nm" type="text" autocomplete="nickname" maxlength="20" enterkeyhint="next"
                   placeholder="可不填" aria-label="稱呼">
            <div class="row">
              <button type="button" data-act="back">上一步</button>
              <button type="button" data-act="next" class="go">下一步</button>
            </div>
          </div>
          <div class="step">
            <div class="top"><span>稽查員名冊　3／3</span><button type="button" data-act="back">‹ 上一步</button></div>
            <p class="q">要收到《昨日病房》的演出消息嗎？</p>
            <p class="note">只用於本劇，不會提供給第三方。</p>
            <div class="row">
              <button type="button" data-act="no">先不用</button>
              <button type="button" data-act="yes" class="go">要，寄給我</button>
            </div>
          </div>
          <div class="step thanks">
            <b>已列入名冊</b>
            <p class="why">謝謝你，稽查員。<br>下一份派令，會寄到你的信箱。</p>
            <div class="row"><button type="button" data-act="close">回到評分表</button></div>
          </div>
        </form>
      </div>

    </div>
    <span class="mark">MEIHAN&nbsp;OPTICAL&nbsp;LCD</span>
    <span class="led"></span>
  </div>

  <div class="silk">本機事證紀錄依病院評鑑辦法第七條辦理</div>

  <div class="ctrl">
    <div class="pad">
      <div class="dpad">
        <button class="key u" data-k="up" aria-label="上">▲</button>
        <button class="key l" data-k="left" aria-label="左">◀</button>

function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i,ch;
  text=text.replace(/^﻿/,"");
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    if(q){
      if(ch==='"'){ if(text.charAt(i+1)==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }
    else if(ch==='"')q=true;
    else if(ch===",")  {row.push(cur);cur="";}
    else if(ch==="\n") {row.push(cur);rows.push(row);row=[];cur="";}
    else if(ch!=="\r") cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){
    return r.some(function(c){return c!=="";});
  });
}

function applySheet(text){
  var rows=parseCSV(text);
  if(rows.length<2)return false;
  var head=rows[0].map(function(s){return s.trim();});
  var col={};
  head.forEach(function(h,i){col[h]=i;});
  var need=["代號","名稱","敘述","分數"];
  for(var k=0;k<need.length;k++)if(col[need[k]]===undefined)return false;

  var want=CLUES.filter(function(c){return !c.bonus;}).length;
  var body=rows.slice(1);
  if(body.length!==want)return false;

  var seen={},staged=[],keyPerPhase={},i,r,id,c,s;
  for(i=0;i<body.length;i++){
    r=body[i];
    id=(r[col["代號"]]||"").trim();
    c=CLUE[id];
    if(!c||c.bonus||seen[id])return false;      /* 不認識、或重複 */
    seen[id]=1;
    s=Number((r[col["分數"]]||"").trim());
    if(!isFinite(s)||s===0||s!==Math.round(s))return false;
    var isKey=/^[YyＹ1]/.test((r[col["關鍵標的"]]!==undefined?r[col["關鍵標的"]]:"")||"");
    if(isKey)keyPerPhase[c.ph]=(keyPerPhase[c.ph]||0)+1;
    staged.push({c:c,r:r,s:s,key:isKey});
  }
  /* 每一章都必須剛好有一件關鍵標的，否則角色不會出現、遊戲會卡死 */
  for(i=0;i<6;i++)if(keyPerPhase[i]!==1)return false;

  var un=function(v){return (v||"").replace(/\\n/g,"\n");};
  staged.forEach(function(x){
    var r=x.r,c=x.c;
    c.n=(r[col["名稱"]]||c.n).trim();
    c.t=un(r[col["敘述"]])||c.t;
    c.s=x.s;
    c.key=x.key?1:0;
    if(col["初步觀察"]!==undefined&&r[col["初步觀察"]])c.d=un(r[col["初步觀察"]]);
    if(col["評鑑項目"]!==undefined&&r[col["評鑑項目"]])c.cat=r[col["評鑑項目"]].trim();
    if(col["限閱"]!==undefined)c.lock=/^[YyＹ1]/.test(r[col["限閱"]]||"")?1:0;
  });
  return true;
}

/* 把一份線上 CSV 抓回來。done() 不管成功失敗都只會被叫一次，開場才不會卡住。 */
function grabCSV(url,ok){
  var done=false;
  var finish=function(){if(done)return;done=true;booting--;};
  if(typeof fetch!=="function"){finish();return;}
  setTimeout(finish,8000);                    /* 網路太慢就先讓玩家進遊戲 */
  try{
    fetch(url+"&_="+Date.now(),{mode:"cors",credentials:"omit",cache:"no-store"})
      .then(function(r){return r.ok?r.text():null;})
      .then(function(t){
        if(!done&&t){try{ok(t);}catch(e){}}
        finish();
      })["catch"](finish);
  }catch(e){finish();}
}

var CODEBITS=(function(){
  var bin,a,i,n;
  try{bin=atob(CODEB64);}catch(e){return null;}
  n=bin.length;a=new Uint8Array(n);
  for(i=0;i<n;i++)a[i]=bin.charCodeAt(i);
  return a;
})();

/* 線上名單（試算表第一個分頁）。抓得到就以它為準，抓不到才用上面烤進來的點陣圖。
   這樣使用者在試算表裡加一批新碼，玩家重新整理就能用，不必重新部署。 */
var CODELIVE=null;
function applyCodes(text){
  var rows=parseCSV(text);
  if(rows.length<2)return false;
  var list=[],free=[],seen={},i,v;
  for(i=1;i<rows.length;i++){
    v=(rows[i][0]||"").trim();
    if(!/^\d{5}$/.test(v)||seen[v])continue;
    seen[v]=1;list.push(v);
    if(!(rows[i][1]||"").trim())free.push(v);   /* B 欄「發放時間」空白＝還沒發出去 */
  }
  if(list.length<100)return false;   /* 名單明顯壞掉（或抓到登入頁）就不要用 */
  CODELIVE={set:seen,list:list,free:free};
  /* 玩家手上那組如果已經不在新名單裡，換一組給他 */
  if(myCode&&myCode!==MASTER&&!seen[myCode]){
    myCode=pickCode();freshCode=true;
    try{localStorage.setItem("mbh_code5",myCode);}catch(e){}
  }
  return true;
}

var MASTER="54080";           /* 通用預設推薦碼，刻意不在名單內 */
function isCode(v){
  if(!/^\d{5}$/.test(v))return false;
  if(v===MASTER)return true;
  if(CODELIVE)return !!CODELIVE.set[v];
  if(!CODEBITS)return true;   /* 點陣圖壞了就不要擋人 */
  var i=+v-10000;
  return i>=0&&i<90000&&!!(CODEBITS[i>>3]>>(i&7)&1);
}
function pickCode(){         /* 從名單裡發一組給這位玩家 */
  if(CODELIVE){
    var pool=CODELIVE.free.length?CODELIVE.free:CODELIVE.list;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  if(!CODEBITS)return String(10000+Math.floor(Math.random()*90000));
  var i=Math.floor(Math.random()*90000),k,j;
  for(k=0;k<90000;k++){
    j=(i+k)%90000;
    if(CODEBITS[j>>3]>>(j&7)&1)return String(j+10000);
  }
  return MASTER;
}
var freshCode=false;          /* 這組碼是不是這次才在瀏覽器裡臨時抽的（還沒向櫃台領過） */
function genCode(){
  var c;try{c=localStorage.getItem("mbh_code5");}catch(e){}
  if(!c||c===MASTER||!isCode(c)){   /* 舊版隨機碼不在名單內，換一組 */
    c=pickCode();freshCode=true;
    try{localStorage.setItem("mbh_code5",c);}catch(e){}
  }
  return c;
}
myCode=genCode();

/* 向發碼櫃台領碼。每台裝置只需要成功一次（記在 mbh_claim）：
   新玩家 → 櫃台發一組沒人用過的；老玩家 → 把他手上的碼登記成已發放，碼不變（他可能早就分享出去了）。
   櫃台連不上就沿用瀏覽器抽的那組，下次開遊戲再試。 */
function claimCode(){
  if(!CLAIM_URL||typeof fetch!=="function")return;
  var reg;try{reg=localStorage.getItem("mbh_claim");}catch(e){}
  if(reg&&reg===myCode)return;
  booting++;
  var done=false,fin=function(){if(done)return;done=true;booting--;};
  setTimeout(fin,8000);
  function ask(code,tries){
    var url=CLAIM_URL+(code?"?code="+encodeURIComponent(code)+"&":"?")+"_="+Date.now();
    fetch(url,{credentials:"omit",cache:"no-store",redirect:"follow"})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        /* 試算表名單裡剛好有通用碼 54080：櫃台萬一發到它，它已被標記，再領一次就會是別組 */
        if(!done&&d&&d.code===MASTER&&tries<2){ask("",tries+1);return;}
        if(!done&&d&&/^\d{5}$/.test(d.code||"")&&d.code!==MASTER){
          myCode=d.code;freshCode=false;
          try{localStorage.setItem("mbh_code5",myCode);localStorage.setItem("mbh_claim",myCode);}catch(e){}
        }
        fin();
      })["catch"](fin);
  }
  try{ask(freshCode?"":myCode,0);}catch(e){fin();}
}
claimCode();

/* ════════ 輸入 ════════ */
var held={},just={};
/* 結尾表單打開時要完全關掉遊戲輸入：不然玩家在輸入框打字，
   w/a/s/d/z/x 會被當成方向鍵與 ＡＢ，而且 preventDefault 會讓字根本打不進去。 */
var formOpen=false;
function typing(e){
  if(formOpen)return true;
  var t=e&&e.target,n=t&&t.nodeName;
  return n==="INPUT"||n==="TEXTAREA"||n==="SELECT"||(t&&t.isContentEditable);
}
function down(k){if(formOpen)return;if(!held[k])just[k]=true;held[k]=true;}
function up(k){held[k]=false;}
Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(el){
  var k=el.dataset.k;el.style.touchAction="none";
  var on=function(e){e.preventDefault();down(k);el.classList.add("on");
    if(el.setPointerCapture&&e.pointerId!=null){try{el.setPointerCapture(e.pointerId);}catch(_){}}};
  var off=function(e){e.preventDefault();up(k);el.classList.remove("on");};
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("lostpointercapture",off);
  el.addEventListener("contextmenu",function(e){e.preventDefault();});
});
var KEY={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
  z:"a",Z:"a",x:"b",X:"b",Enter:"start",Shift:"select",w:"up",s:"down",a:"left",d:"right"," ":"a"};
addEventListener("keydown",function(e){if(typing(e))return;var k=KEY[e.key];if(k){e.preventDefault();down(k);}});
addEventListener("keyup",function(e){if(typing(e))return;var k=KEY[e.key];if(k)up(k);});

var dlg=null,menu=null,codeUI=null,book=null,entry=null,intro=null,bt=null;
/* 對話框一次只畫得下 4 行，超過的部分以前會被默默截掉（「四大守則牌」的第四句
   「揚棄幫助我們成就自己。」就是這樣不見的）。線索文字現在是使用者自己在試算表裡
   寫的，長度不可控，所以改成超過就自動分頁，再按一次 Ａ 看下一頁。
   分頁時用比繪製時再窄一點的寬度換行（208 vs 216），這樣字型載入前後的量測誤差
   不會讓某一行在繪製時又被拆成兩行、湊成第五行被切掉。 */
var DLG_LINES=4;
function paginate(pages){
  var out=[];
  pages.forEach(function(p){
    var ls=wrap(String(p),208,FT),i;
    /* 平均分配，避免最後一頁只剩孤零零一行（5 行會切成 3+2，不是 4+1） */
    var n=Math.ceil(ls.length/DLG_LINES),per=Math.ceil(ls.length/n);
    for(i=0;i<ls.length;i+=per)out.push(ls.slice(i,i+per).join("\n"));
  });
  return out.length?out:[""];
}
function say(name,pages,then){dlg={name:name,pages:paginate(pages),i:0,chars:0,then:then||null};mode="dialog";}
function openMenu(title,items,onCancel){menu={title:title,items:items,idx:0,cancel:onCancel||null};mode="menu";}

/* ── 提示：角色透露某一件是加分還是扣分 ── */
function applyHints(a){

/* 大廳沒有人帶路，第一組提示寫在派令的備註欄裡 */
function startGame(){

/* ── 調查流程：先說明，再決定查不查 ── */
function approach(id){
  var c=CLUE[id];
  if(has(id)){say("事證",["【"+c.n+"】\n這一項你已經記錄過了。"]);return;}
  var pages=[c.d
    +(hinted[id]?"\n（有人提過：這一項"+(hinted[id]==="+"?"加分":"扣分")+"。）":"")
    +(resolved[id]?"\n（你剛才略過了它。）":"")];
  if(c.key)pages.push("※ 關鍵標的\n一經調查，院方就會察覺，\n並把你帶往下一個區域。\n（這裡之後還能自己走回來。）");
  say(c.key?"初步觀察　※關鍵":"初步觀察",pages,function(){
    openMenu(c.key?"要動它嗎？":"要調查嗎？",[
      {label:"調查",fn:function(){investigate(id);}},
      {label:"先不查",fn:function(){skipClue(id);}}
    ],function(){mode="play";});

function skipClue(id){
  resolved[id]=true;mode="play";
  say("稽查",["你把手收了回來。\n這一項不列入紀錄。"]);
}
function investigate(id){
  var c=CLUE[id];

    say("限閱",["此卷宗列為限閱，\n須經他院稽查員複核。",
      "請輸入另一位稽查員的推薦碼。\n（你的推薦碼："+myCode+"）"],function(){
      codeUI={digits:[0,0,0,0,0],pos:0,msg:"",then:function(ok){
        if(ok){unlocked[id]=true;mode="play";award(id);}

}
function award(id,silent){

  say("事證",[
    "【"+c.n+"】\n"+c.t,
    "評鑑項目："+c.cat+"\n計分："+sign+Math.abs(c.s)+" 分\n已記入稽查手冊。"
  ],silent?null:function(){if(c.key)advance();});
}

/* ── 章節推進：只有關鍵標的會觸發 ── */
function advance(){
  if(phase>=PHASES.length)return;
  var a=PHASES[phase].after;
  if(a.battle){startBattle();return;}
  if(a.final){
    guest={k:"nur",x:Math.max(30,Math.min(226,pl.x+26)),y:pl.y};
    say("護士長 孫儷玹",["「都看完了。」","「評分表，就交給你了。」"],function(){
      guest=null;phase++;
      openMenu("提交評分表？",[
        {label:"確定提交",fn:function(){finish();}},
        {label:"再看一次",fn:function(){mode="play";}}
      ]);
    });
    return;
  }
  guest={k:a.npc,x:Math.max(30,Math.min(226,pl.x+26)),y:pl.y};
  say(NPC[a.npc].name,a.lines,function(){
    guest=null;phase++;room=a.go;opened[a.go]=1;applyHints(a);
    pl.x=(room==="hall")?(HALLBACK[PHASES[phase-1].room]||128):128;
    pl.y=(room==="hall")?114:108;
    say("",["——　"+ROOMS[room].name+"　已解鎖　——"]);
  });
}
var HALLBACK={office:34,clinic:88,popo:142,ward:208};

/* ── 區域與碰撞 ── */
/* 已經登場過的都留著：解鎖的區域可以隨時走回去補查 */
function activeProps(){
  var r=ROOMS[room],out=[];
  for(var id in r.props){
    var c=CLUE[id];
    if(c&&c.ph<=phase)out.push({id:id,p:r.props[id]});
  }
  return out;
}
function activeZone(){
  var i;
  for(i=0;i<DOORS[room].length;i++){
    var d=DOORS[room][i];
    if(pl.x>=d.z[0]&&pl.x<=d.z[0]+d.z[2]&&pl.y>=d.z[1]&&pl.y<=d.z[1]+d.z[3])return {go:d.to};
  }
  var ap=activeProps();
  for(i=0;i<ap.length;i++){
    var q=ap[i].p.zone;
    if(pl.x>=q[0]&&pl.x<=q[0]+q[2]&&pl.y>=q[1]&&pl.y<=q[1]+q[3])return {clue:ap[i].id};
  }
  return null;
}
var DOORS={
  hall:[{z:[20,88,30,16],to:"office"},{z:[74,88,30,16],to:"clinic"},
        {z:[128,88,30,16],to:"popo"},{z:[194,88,30,16],to:"ward"}],
  office:[{z:[116,88,26,16],to:"hall"}],
  clinic:[{z:[116,88,26,16],to:"hall"}],
  popo:[{z:[116,88,26,16],to:"hall"}],
  ward:[{z:[116,88,26,16],to:"hall"}]
};
function blocked(x,y){
  var r=ROOMS[room],s=r.solids||[],i;
  for(i=0;i<s.length;i++){var b=s[i];if(x>b[0]&&x<b[0]+b[2]&&y>b[1]&&y<b[1]+b[3])return true;}
  var ap=activeProps();
  for(i=0;i<ap.length;i++){
    var sb=ap[i].p.solid;
    if(sb&&x>sb[0]&&x<sb[0]+sb[2]&&y>sb[1]&&y<sb[1]+sb[3])return true;
  }
  return false;
}

/* ════════ 波波對戰 ════════ */
var POSR=[
 ["「哇——！」\n「這個我看過！我有看過！」","波波原地轉了兩圈。"],
 ["「好漂亮喔……」\n「可以再給我看一次嗎？」"],
 ["「這個是好的對不對？」\n「你要寫在本子上喔！」"]
];
var NEGR=[
 ["「……這個我不可以看。」\n「護士長會生氣。」","波波往後退了半步。"],
 ["「不要……」\n「我不要想起來。」"],
 ["「你不要寫這個好不好。」\n「寫了他們就不給我糖了。」"]
];
var SPECIAL={
 doll :["「那是我的兔子！」","「是一個哥哥做的。」\n「他說他也想要朋友。」"],
 draw :["「你有看我的畫！」\n「我畫了好多好多朋友喔。」"],
 sched:["「……那個是我的睡覺表。」","「我不想睡那麼久。」\n「睡著就沒有今天了。」"],
 safe :["「黑黑的……」\n「看了頭會痛。」"],
 radio:["「愛家獎券！」\n「我中過一次喔！」"],
 band :["「這個戴起來會亮。」\n「亮綠色的時候大家會拍手。」"],
 rule :["「秩序、效率、質疑、揚棄！」","「我背得出來！」\n「背得出來就有餅乾。」"],
 index:["「那裡面有我嗎？」\n「……五四八有在裡面嗎？」"]
};
function startBattle(){
  var pool=found.filter(function(id){return !CLUE[id].bonus;});
  bt={stage:"intro",round:0,max:Math.min(3,pool.length),given:[],sum:0,mood:50,
      msg:["有人從走廊衝了進來！",
           "「那是我的兔子！」\n「……你是新來的嗎？\n　我是波波！」",
           "「你查到什麼了？」\n「給我看好不好——」"],mi:0,mc:0,
      pick:{idx:0}};
  if(pool.length===0){
    bt.msg=["有人從走廊衝了進來！",
            "「那是我的兔子！」\n「你查到什麼了？」",
            "你什麼都拿不出來。\n波波的耳朵垂了下來。"];
    bt.stage="empty";
  }
  mode="battle";
}
function battlePool(){
  return found.filter(function(id){
    return !CLUE[id].bonus&&bt.given.indexOf(id)<0;
  });
}
function btSay(pages,next){bt.msg=pages;bt.mi=0;bt.mc=0;bt.stage=next;}
function btGive(id){
  var c=CLUE[id];
  bt.given.push(id);bt.sum+=c.s;
  bt.mood=Math.max(0,Math.min(100,bt.mood+c.s*4));
  var lines=SPECIAL[id]||(c.s>0?POSR[bt.round%POSR.length]:NEGR[bt.round%NEGR.length]);
  var pages=["你把「"+c.n+"」給波波看。"].concat(lines);
  bt.round++;
  btSay(pages,"react");
}
function btReward(){
  var gid = bt.sum>=6?"gift_a":(bt.sum<=-6?"gift_c":"gift_b");
  var lead = bt.sum>=6
    ? ["波波笑得眼睛都瞇起來了。","「你是好人耶。」\n「我也要給你一個東西。」"]
    : (bt.sum<=-6
      ? ["波波安靜了很久。","「……你都知道了。」\n「那我跟你說一件事，」\n「你不要跟他們講。」"]
      : ["波波歪著頭想了一下。","「嗯——」\n「那我告訴你一件事好了。」"]);
  bt.gid=gid;
  btSay(lead,"reward");
}
/* 波波臨走前也會提示病人房的兩件 */
var POPO_HINT=[
  "「病房的棉被摺得超好看的！\n　你一定要寫！」",
  "「……交班本不要看喔。」\n「上面寫的都不是真的，\n　可是他們說那樣才對。」"];
function btEnd(){
  var gid=bt.gid;bt=null;mode="play";
  phase++;room=PHASES[3].after.go;opened[room]=1;pl.x=128;pl.y=108;
  applyHints(PHASES[3].after);
  award(gid,true);
  dlg.then=function(){

/* ════════ 更新 ════════ */
function update(){
  blink++;
  /* 對戰時音樂加速；不管對戰從哪個出口結束都會自己恢復 */
  setBgmRate(mode==="battle"?2:1);
  if(mode==="play")elapsed=(Date.now()-t0)/1000;

  if(mode==="title"){if(booting<=0&&(just.start||just.a)){mode="intro";intro={i:0};}return;}

  if(mode==="intro"){
    if(just.a||just.start){intro.i++;if(intro.i>=INTRO.length)startGame();}
    if(just.b&&intro.i>0)intro.i--;
    return;
  }

  if(mode==="dialog"){
    var pg=dlg.pages[dlg.i];
    if(dlg.chars<pg.length)dlg.chars+=2;
    if(just.a||just.start){
      if(dlg.chars<pg.length)dlg.chars=pg.length;
      else{
        dlg.i++;
        if(dlg.i>=dlg.pages.length){var f=dlg.then;dlg=null;mode="play";if(f)f();}
        else dlg.chars=0;
      }
    }
    return;
  }

  if(mode==="menu"){
    if(just.up)menu.idx=(menu.idx+menu.items.length-1)%menu.items.length;
    if(just.down)menu.idx=(menu.idx+1)%menu.items.length;
    if(just.a){var it=menu.items[menu.idx];menu=null;it.fn();return;}
    if(just.b){var cf=menu.cancel;menu=null;if(cf)cf();else mode=book?"book":"play";}
    return;
  }

  if(mode==="code"){
    if(just.left)codeUI.pos=(codeUI.pos+4)%5;
    if(just.right)codeUI.pos=(codeUI.pos+1)%5;
    if(just.up)codeUI.digits[codeUI.pos]=(codeUI.digits[codeUI.pos]+1)%10;
    if(just.down)codeUI.digits[codeUI.pos]=(codeUI.digits[codeUI.pos]+9)%10;
    if(just.b){var f2=codeUI.then;codeUI=null;f2(false);}
    if(just.a){
      var v=codeUI.digits.join("");
      if(v===myCode){codeUI.msg="不可使用自己的推薦碼。";}
      else if(!isCode(v)){codeUI.msg="查無此推薦碼，請再確認。";}
      else{var f3=codeUI.then;codeUI=null;
        say("複核",["推薦碼 "+v+" 複核通過。\n限閱卷宗已解鎖。"],function(){f3(true);});}
    }
    return;
  }

  if(mode==="book"){
    var total=found.length+2;
    if(just.up)book.idx=(book.idx+total-1)%total;
    if(just.down)book.idx=(book.idx+1)%total;
    if(just.start||just.b){book=null;mode="play";}
    if(just.a){
      if(book.idx<found.length){entry={i:book.idx};mode="entry";}
      else if(book.idx===found.length){
        openMenu("提交評分表？",[
          {label:"確定提交",fn:function(){book=null;finish();}},
          {label:"再看一次手冊",fn:function(){mode="book";}}
        ]);
      }else{book=null;mode="play";}
    }
    return;
  }

  if(mode==="entry"){
    if(found.length>1){
      if(just.left)entry.i=(entry.i+found.length-1)%found.length;
      if(just.right)entry.i=(entry.i+1)%found.length;
    }
    if(just.a||just.b||just.start){book.idx=entry.i;entry=null;mode="book";}
    return;
  }

  if(mode==="battle"){
    if(bt.stage==="pick"){
      var pool=battlePool();
      if(just.up)bt.pick.idx=(bt.pick.idx+pool.length-1)%pool.length;
      if(just.down)bt.pick.idx=(bt.pick.idx+1)%pool.length;
      if(just.a)btGive(pool[bt.pick.idx]);
      return;
    }
    var m=bt.msg[bt.mi];
    if(bt.mc<m.length)bt.mc+=2;
    if(just.a||just.start){
      if(bt.mc<m.length){bt.mc=m.length;return;}
      bt.mi++;
      if(bt.mi<bt.msg.length){bt.mc=0;return;}
      if(bt.stage==="intro"){bt.pick.idx=0;bt.stage="pick";return;}
      if(bt.stage==="react"){
        if(bt.round>=bt.max)btReward();
        else{bt.pick.idx=0;bt.stage="pick";}
        return;
      }
      if(bt.stage==="empty"){bt=null;mode="play";
        phase++;room=PHASES[3].after.go;opened[room]=1;pl.x=128;pl.y=108;
        applyHints(PHASES[3].after);
        say("548 波波",POPO_HINT,function(){
          say("",["——　"+ROOMS[room].name+"　已解鎖　——"]);
        });return;}
      if(bt.stage==="reward"){btEnd();return;}
    }
    return;
  }

  if(mode==="result"){if(just.a||just.start)location.reload();return;}

  /* ── play ── */
  if(just.start){book={idx:found.length};mode="book";return;}
  if(just.select){say("推薦碼",["你的稽查員推薦碼：\n　　　"+myCode+
    "\n把它給別人，別人就能\n複核他那邊的限閱卷宗。"]);return;}

  var sp=(held.b?1.9:1.2),dx=0,dy=0;
  if(held.left){dx-=sp;pl.face=-1;}
  if(held.right){dx+=sp;pl.face=1;}
  if(held.up)dy-=sp;
  if(held.down)dy+=sp;
  pl.walking=!!(dx||dy);
  if(pl.walking)pl.step+=0.18;
  var nx=Math.max(WALK.x0,Math.min(WALK.x1,pl.x+dx));
  var ny=Math.max(WALK.y0,Math.min(WALK.y1,pl.y+dy));
  if(!blocked(nx,pl.y))pl.x=nx;
  if(!blocked(pl.x,ny))pl.y=ny;

  if(just.a){
    var z=activeZone();
    if(z){
      if(z.go){
        if(!opened[z.go]){
          say("門",["門鎖著。\n未經院方人員帶領，\n稽查員不得進入。"]);
        }else{
          var from=room;room=z.go;
          if(room==="hall"){pl.x=HALLBACK[from]!==undefined?HALLBACK[from]:128;pl.y=114;}
          else{pl.x=128;pl.y=108;}
        }
      }
      else if(z.clue)approach(z.clue);
    }
  }
}

/* ════════ 繪製 ════════ */

function drawPlay(){
  var r=ROOMS[room];
  r.scenery();
  activeProps().forEach(function(o){o.p.draw();});

  var actors=[];
  if(guest)actors.push({y:guest.y,f:function(){
    sprite(NPC[guest.k].spr,guest.x,guest.y,guest.x>pl.x,0);}});
  actors.push({y:pl.y,f:function(){
    sprite("you",pl.x,pl.y,pl.face<0,(pl.walking&&Math.floor(pl.step)%2)?-1:0);}});
  actors.sort(function(a,b){return a.y-b.y;}).forEach(function(o){o.f();});

  var z=activeZone();
  if(z&&mode==="play"){
    var label;
    if(z.go)label=(opened[z.go]?"→ ":"✕ ")+ROOMS[z.go].name+(opened[z.go]?"":"（上鎖）");
    else{
      var c=CLUE[z.clue];
      label=c.n;
      if(hinted[z.clue])label+=(hinted[z.clue]==="+"?"　＋":"　－");
      if(c.key)label+="　※關鍵";
      label+=has(z.clue)?"（已記錄）":(resolved[z.clue]?"（未查）":"");
    }
    var w=tw(label,FTS)+34;
    var bx=Math.max(4,Math.min(W-4-w,pl.x-w/2));
    shade(bx+2,169,w,19,.18);
    panel(bx,167,w,19,K.cream);
    txt(label,bx+9,180,K.ink,FTS);
    if(blink%40<26)txt("A",bx+w-16,180,K.red,FTP);
    if(z.clue&&!has(z.clue)){px(pl.x-1,pl.y-28,3,7,K.gold);px(pl.x-1,pl.y-19,3,3,K.gold);}
  }
  drawHUD();
}

var RESULT=null,N_END=5;
/* 評語最多三行：第一行是公文結論，第二行是一件讓人發毛的小事——只暗示「這裡不對勁」，不說破（劇透分級） */
function grade(s){
  if(s>=90)return{i:0,g:"特　優",st:"合　格",c:["各項俱優，准予表揚為模範。","院長關上了門，跟你說：","「你可以留下來了。」"]};
  if(s>=75)return{i:1,g:"甲　等",st:"合　格",c:["管理完善，准予列入名錄。","臨走前，你想不起昨天的事。"]};
  if(s>=60)return{i:2,g:"乙　等",st:"有條件",c:["限期三個月改善，屆時複查。","回過神，才發現手上拿的","是一張複診通知單。"]};
  if(s>=45)return{i:3,g:"丙　等",st:"不合格",c:["事證堪虞，病人處遇待說明。","走到大門口，打開門，","卻走進了一間多人病房……"]};
  return{i:4,g:"丁　等",st:"不合格",c:["情節重大，建請即刻複查。","病歷櫃裡，有一份你的病歷。"]};
}
function seenEndings(){try{return localStorage.getItem("mbh_end")||"";}catch(e){return "";}}
function markEnding(i){
  var s=seenEndings();
  if(s.indexOf(String(i))<0){s+=String(i);try{localStorage.setItem("mbh_end",s);}catch(e){}}
  return s;
}
function fmtTime(){var m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);return m+" 分 "+(s<10?"0":"")+s+" 秒";}
function finish(){
  var s=score(),g=grade(s);
  RESULT={s:s,g:g,n:nMain(),sk:nSkip(),seen:markEnding(g.i)};
  mode="result";
  var el=document.getElementById("stamp");
  el.innerHTML="<span>"+g.st+"<b>衛生處</b></span>";
  el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
  document.getElementById("share").classList.add("show");
  /* 表單還沒設定、或這台裝置已經登記過，就不要再擋著版面 */
  if(FORM&&!mailSent())document.getElementById("mail").classList.add("show");
  document.getElementById("share").parentNode.classList.add("done");
}

  else if(mode==="menu")drawMenu();
  else if(mode==="code")drawCode();
  else if(mode==="book")drawBook();

  else if(mode==="result")drawResult();

}

/* ════════ 分享圖（9:16，給 IG 限動）════════ */
/* 分享的是「整台機器」：結尾那一格螢幕照原樣畫出來（連紅印章），整數放大三倍，
   貼進用 Canvas 重畫的 GAMEBOY 機身；推薦碼做成貼在機身上的稽查貼紙。
   機身下緣那三顆 HTML 小按鈕不會出現在圖裡。 */
var GAME_URL="https://ojku.github.io/WARD/";

function stamp(cx,cy,r,txt1,txt2){
  ctx.save();
  ctx.translate(cx,cy);ctx.rotate(-13*Math.PI/180);
  ctx.strokeStyle=K.redD;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();
  ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(0,0,r-5,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=K.redD;ctx.textAlign="center";ctx.textBaseline="alphabetic";
  ctx.font='900 17px "Noto Sans TC",sans-serif';ctx.fillText(txt1,0,2);
  ctx.font='700 9px "Noto Sans TC",sans-serif';ctx.fillText(txt2,0,16);
  ctx.textAlign="left";
  ctx.restore();
}

/* 分享圖裡要不要把螢幕底下那行輪播提示換成固定字（截圖不該停在半句「↓ 可分享…」上） */
var sharing=false;

/* 圓角矩形路徑，四角半徑依 CSS 順序：左上、右上、右下、左下 */
function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r[0],y);
  c.lineTo(x+w-r[1],y);c.quadraticCurveTo(x+w,y,x+w,y+r[1]);
  c.lineTo(x+w,y+h-r[2]);c.quadraticCurveTo(x+w,y+h,x+w-r[2],y+h);
  c.lineTo(x+r[3],y+h);c.quadraticCurveTo(x,y+h,x,y+h-r[3]);
  c.lineTo(x,y+r[0]);c.quadraticCurveTo(x,y,x+r[0],y);
  c.closePath();
}
function spaced(c,n){ if("letterSpacing" in c)c.letterSpacing=n+"px"; }
function label(c,s,x,y,font,color,align,sp){
  c.font=font;c.fillStyle=color;c.textAlign=align||"left";c.textBaseline="middle";
  spaced(c,sp||0);c.fillText(s,x,y);spaced(c,0);
}

/* 整台 GAMEBOY 機身，照 CSS 的比例畫在 1080×1920 上（u ＝ 機身寬的 1%，等同 CSS 的 cqw） */
function drawShell(c,scr){
  var IW=1080,IH=1920;
  var g=c.createRadialGradient(540,0,0,540,0,IH*1.05);
  g.addColorStop(0,"#34382e");g.addColorStop(.6,"#23261f");g.addColorStop(1,"#16180f");
  c.fillStyle=g;c.fillRect(0,0,IW,IH);

  var X=60,Y=64,SW=960,SH=1770,u=SW/100,P=40;

  /* 機身 */
  c.save();
  c.shadowColor="rgba(0,0,0,.55)";c.shadowBlur=60;c.shadowOffsetY=28;
  rr(c,X,Y,SW,SH,[4*u,4*u,13*u,4*u]);
  var sg=c.createLinearGradient(X+SW*.4,Y,X+SW*.6,Y+SH);
  sg.addColorStop(0,"#e3ddcc");sg.addColorStop(.3,"#cec8b6");sg.addColorStop(1,"#a9a390");
  c.fillStyle=sg;c.fill();
  c.restore();
  rr(c,X,Y,SW,SH,[4*u,4*u,13*u,4*u]);
  c.lineWidth=2;c.strokeStyle="#7e7866";c.stroke();
  rr(c,X+3,Y+3,SW-6,SH-6,[4*u-3,4*u-3,13*u-3,4*u-3]);
  c.lineWidth=2;c.strokeStyle="rgba(255,255,255,.55)";c.stroke();

  /* 銘板 */
  var L=X+P,R=X+SW-P,py=Y+P+22;
  c.font='700 24px "Noto Sans TC",sans-serif';spaced(c,5);
  var tagW=c.measureText("臺灣省衛生處").width+32;spaced(c,0);
  c.fillStyle="#8d2f28";c.fillRect(L,py-21,tagW,42);
  label(c,"臺灣省衛生處",L+16,py+1,'700 24px "Noto Sans TC",sans-serif',"#f3e7dc","left",5);
  c.font='500 24px "Noto Sans TC",sans-serif';spaced(c,3);
  var rw=c.measureText("病院稽查機　59-A").width;spaced(c,0);
  c.globalAlpha=.85;
  label(c,"病院稽查機　59-A",R,py+1,'500 24px "Noto Sans TC",sans-serif',"#2a281f","right",3);
  c.globalAlpha=.4;c.fillStyle="#7e7866";c.fillRect(L+tagW+18,py,R-rw-18-(L+tagW+18),2);
  c.globalAlpha=1;

  /* 螢幕框：遊戲畫面整數放大三倍（256×192 → 768×576），像素才會方正 */
  var bx=L,by=Y+100,bw=R-L,SC=3,sw=W*SC,shh=H*SC;
  var bh=40+shh+66;
  rr(c,bx,by,bw,bh,[24,24,58,24]);
  var bg=c.createLinearGradient(0,by,0,by+bh);bg.addColorStop(0,"#333729");bg.addColorStop(1,"#22261c");
  c.fillStyle=bg;c.fill();
  c.lineWidth=3;c.strokeStyle="rgba(0,0,0,.35)";c.stroke();
  var sx=bx+(bw-sw)/2,sy=by+40;
  c.imageSmoothingEnabled=false;
  c.drawImage(scr,sx,sy,sw,shh);
  /* 掃描線：每一個遊戲像素一條，跟機器上看到的一樣 */
  c.fillStyle="rgba(12,9,22,.07)";
  for(var ly=sy;ly<sy+shh;ly+=SC)c.fillRect(sx,ly,sw,1);
  c.lineWidth=4;c.strokeStyle="rgba(25,35,27,.45)";c.strokeRect(sx+2,sy+2,sw-4,shh-4);
  label(c,"MEIHAN OPTICAL LCD",bx+36,by+bh-24,'500 19px "Noto Sans TC",sans-serif',"#8d9482","left",5);
  c.save();c.shadowColor="rgba(196,69,58,.9)";c.shadowBlur=14;
  c.fillStyle="#c4453a";c.beginPath();c.arc(bx+bw-44,by+bh-26,8,0,Math.PI*2);c.fill();c.restore();

  var cy=by+bh+38;
  c.globalAlpha=.45;
  label(c,"本機事證紀錄依病院評鑑辦法第七條辦理",540,cy,'500 21px "Noto Sans TC",sans-serif',"#2a281f","center",5);
  c.globalAlpha=1;

  /* 推薦碼貼紙：貼在機身上的稽查標籤，傳出去的圖一定帶著碼 */
  var ky=cy+34,kw=720,kh=168;
  c.save();c.translate(540,ky+kh/2);c.rotate(-1.6*Math.PI/180);
  c.save();c.shadowColor="rgba(0,0,0,.28)";c.shadowBlur=10;c.shadowOffsetY=4;
  c.fillStyle="#f2ead6";c.fillRect(-kw/2,-kh/2,kw,kh);c.restore();
  c.strokeStyle="#8d2f28";c.lineWidth=3;c.strokeRect(-kw/2+10,-kh/2+10,kw-20,kh-20);
  c.lineWidth=1;c.strokeRect(-kw/2+16,-kh/2+16,kw-32,kh-32);
  label(c,"稽查員推薦碼",0,-kh/2+44,'700 24px "Noto Sans TC",sans-serif',"#6d6880","center",6);
  label(c,myCode,0,-kh/2+94,'60px "Press Start 2P",monospace',"#8d2f28","center",6);
  label(c,"把這組碼給下一位稽查員，他才解得開限閱卷宗。",0,-kh/2+138,'700 21px "Noto Sans TC",sans-serif',"#6d6880","center",1);
  c.restore();

  /* 方向鍵 */
  var k=12.5*u,dx=L+2*u,dy=ky+kh+40,rad=1.6*u;
  function cross(ox,oy){
    c.beginPath();
    c.moveTo(ox+k+rad,oy);c.lineTo(ox+2*k-rad,oy);c.quadraticCurveTo(ox+2*k,oy,ox+2*k,oy+rad);
    c.lineTo(ox+2*k,oy+k);c.lineTo(ox+3*k-rad,oy+k);c.quadraticCurveTo(ox+3*k,oy+k,ox+3*k,oy+k+rad);
    c.lineTo(ox+3*k,oy+2*k-rad);c.quadraticCurveTo(ox+3*k,oy+2*k,ox+3*k-rad,oy+2*k);
    c.lineTo(ox+2*k,oy+2*k);c.lineTo(ox+2*k,oy+3*k-rad);c.quadraticCurveTo(ox+2*k,oy+3*k,ox+2*k-rad,oy+3*k);
    c.lineTo(ox+k+rad,oy+3*k);c.quadraticCurveTo(ox+k,oy+3*k,ox+k,oy+3*k-rad);
    c.lineTo(ox+k,oy+2*k);c.lineTo(ox+rad,oy+2*k);c.quadraticCurveTo(ox,oy+2*k,ox,oy+2*k-rad);
    c.lineTo(ox,oy+k+rad);c.quadraticCurveTo(ox,oy+k,ox+rad,oy+k);
    c.lineTo(ox+k,oy+k);c.lineTo(ox+k,oy+rad);c.quadraticCurveTo(ox+k,oy,ox+k+rad,oy);
    c.closePath();
  }
  c.save();c.shadowColor="rgba(0,0,0,.35)";c.shadowBlur=10;c.shadowOffsetY=6;
  cross(dx,dy+4);c.fillStyle="#31332e";c.fill();c.restore();
  cross(dx,dy);
  var dg=c.createLinearGradient(dx,dy,dx+k*.5,dy+3*k);dg.addColorStop(0,"#4d5049");dg.addColorStop(1,"#2b2d28");
  c.fillStyle=dg;c.fill();
  c.fillStyle="#3a3d37";c.fillRect(dx+k+6,dy+k+6,k-12,k-12);
  var af='30px "Noto Sans TC",sans-serif';
  label(c,"▲",dx+1.5*k,dy+.5*k,af,"#cdc8b8","center");
  label(c,"▼",dx+1.5*k,dy+2.5*k,af,"#cdc8b8","center");
  label(c,"◀",dx+.5*k,dy+1.5*k,af,"#cdc8b8","center");
  label(c,"▶",dx+2.5*k,dy+1.5*k,af,"#cdc8b8","center");

  /* A／B：整組轉 -16 度，B 低 A 高 */
  var d=16*u,gap=3.6*u,gw=2*d+gap,gcx=R-2*u-gw/2,gcy=dy+1.5*k-10;
  c.save();c.translate(gcx,gcy);c.rotate(-16*Math.PI/180);
  [["B",-gw/2+d/2,2.5*u,"#5c605a","#474a44","#2a2c28","#dcd9cf"],
   ["A", gw/2-d/2,-2.5*u,"#9c4741","#7e3430","#4e211e","#f0dcd6"]].forEach(function(b){
    c.save();c.shadowColor="rgba(0,0,0,.4)";c.shadowBlur=12;c.shadowOffsetY=7;
    c.fillStyle=b[5];c.beginPath();c.arc(b[1],b[2]+5,d/2,0,Math.PI*2);c.fill();c.restore();
    var rg=c.createLinearGradient(b[1]-d/4,b[2]-d/2,b[1]+d/4,b[2]+d/2);
    rg.addColorStop(0,b[3]);rg.addColorStop(1,b[4]);
    c.fillStyle=rg;c.beginPath();c.arc(b[1],b[2],d/2,0,Math.PI*2);c.fill();
    label(c,b[0],b[1]+3,b[2]+3,'44px "Press Start 2P",monospace',b[6],"center");
  });
  c.restore();

  /* SELECT／START */
  var pw=19*u,ph=4.6*u,pyc=dy+3*k+70;
  [["SELECT",540-pw/2-2.5*u],["START",540+pw/2+2.5*u]].forEach(function(p){
    c.save();c.translate(p[1],pyc);c.rotate(-16*Math.PI/180);
    c.save();c.shadowColor="rgba(0,0,0,.35)";c.shadowBlur=8;c.shadowOffsetY=5;
    rr(c,-pw/2,-ph/2+3,pw,ph,[ph/2,ph/2,ph/2,ph/2]);c.fillStyle="#31332e";c.fill();c.restore();
    rr(c,-pw/2,-ph/2,pw,ph,[ph/2,ph/2,ph/2,ph/2]);
    var pg=c.createLinearGradient(0,-ph/2,0,ph/2);pg.addColorStop(0,"#4d5049");pg.addColorStop(1,"#2b2d28");
    c.fillStyle=pg;c.fill();
    label(c,p[0],0,1,'700 21px "Noto Sans TC",sans-serif',"#d6d2c6","center",3);
    c.restore();
  });

  /* 喇叭孔 */
  var gx=R-3*u,gy=pyc+110;
  c.save();c.translate(gx,gy);c.rotate(-24*Math.PI/180);
  for(var i=0;i<6;i++){
    var hx=-(i+1)*1.5*u-i*2.2*u;
    rr(c,hx,-5*u,1.5*u,10*u,[u*.7,u*.7,u*.7,u*.7]);
    var hg=c.createLinearGradient(0,-5*u,0,5*u);hg.addColorStop(0,"#a49e8c");hg.addColorStop(1,"#bdb7a5");
    c.fillStyle=hg;c.fill();
    c.lineWidth=1.5;c.strokeStyle="rgba(0,0,0,.25)";c.stroke();
  }
  c.restore();

  /* 機身下緣與圖外的網址：限動的圖常常脫離文字被轉傳，網址一定要印在圖上 */
  c.globalAlpha=.72;
  label(c,"《昨日病房》外傳・模範病院稽查",L+12,Y+SH-46,'700 24px "Noto Sans TC",sans-serif',"#2a281f","left",2);
  c.globalAlpha=1;
  label(c,"ojku.github.io/WARD",540,Y+SH+44,'700 32px "Noto Sans TC",sans-serif',"#f6f1e4","center",3);
}

function buildShare(cb){
  /* 1. 在 256×192 畫出結尾那一格螢幕，把 HTML 蓋上去的紅印章也畫進來 */
  var a=document.createElement("canvas");a.width=W;a.height=H;
  var actx=a.getContext("2d");actx.imageSmoothingEnabled=false;
  sharing=true;
  try{
    withCtx(actx,function(){
      px(0,0,W,H,K.night);drawResult();
      ctx.globalAlpha=.88;stamp(210,149,31,RESULT.g.st.replace(/\s/g,""),"衛生處");ctx.globalAlpha=1;
    });
  }finally{sharing=false;}
  /* 2. 整台機身畫在 1080×1920 上，螢幕貼進去 */
  var b=document.createElement("canvas");b.width=1080;b.height=1920;
  var bctx=b.getContext("2d");
  drawShell(bctx,a);
  if(b.toBlob)b.toBlob(function(blob){cb(blob,b);},"image/png");
  else cb(null,b);
}

function flash(el,msg,back){
  var old=el.textContent;el.textContent=msg;
  setTimeout(function(){el.textContent=back||old;},2000);
}

document.getElementById("share").addEventListener("click",function(){
  if(!RESULT)return;

  btn.textContent="製作中…";
  var msg="我在明日之家的稽查結果："+RESULT.s+"／100，"+RESULT.g.g.replace(/\s/g,"")
    +"。\n我的稽查員推薦碼 "+myCode+"（下一位稽查員用得到）\n"
    +"《昨日病房》外傳・模範病院稽查\n"+GAME_URL;
  buildShare(function(blob,cv){
    var file=null;
    try{ if(blob)file=new File([blob],"模範病院評分表.png",{type:"image/png"}); }catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})&&navigator.share){
      var p=navigator.share({files:[file],text:msg});
      if(p&&p["catch"])p["catch"](function(){});
      btn.textContent="分享圖片";
      return;
    }
    /* 不支援檔案分享（多半是桌機）就直接存檔 */
    try{
      var a=document.createElement("a");
      a.href=cv.toDataURL("image/png");
      a.download="模範病院評分表.png";
      document.body.appendChild(a);a.click();a.remove();
      flash(btn,"已存圖","分享圖片");
    }catch(e){ flash(btn,"存圖失敗","分享圖片"); }
  });
});

/* ════════ 結尾的稽查員名冊（一次一題） ════════ */
var subBox=document.getElementById("sub"),
    subForm=document.getElementById("subf"),
    inEmail=document.getElementById("em"),
    inName=document.getElementById("nm"),
    errBox=document.getElementById("er"),
    mailBtn=document.getElementById("mail"),
    steps=subForm.querySelectorAll(".step"),
    step=0,sending=false;
var EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function mailSent(){try{return localStorage.getItem("mbh_mail")==="1";}catch(e){return false;}}
function goStep(n){
  step=n;errBox.textContent="";
  for(var i=0;i<steps.length;i++)steps[i].classList.toggle("on",i===n);
  var inp=steps[n].querySelector("input");
  /* 有輸入框的頁面直接聚焦（email → 稱呼之間鍵盤不會收起來）；沒有的就收鍵盤 */
  if(inp)setTimeout(function(){try{inp.focus();}catch(e){}},50);
  else{try{document.activeElement.blur();}catch(e){}}
}
function openForm(){formOpen=true;held={};just={};subBox.hidden=false;goStep(0);}
function closeForm(){
  formOpen=false;held={};just={};subBox.hidden=true;
  try{document.activeElement.blur();}catch(e){}
}
function emailOk(){
  if(EMAIL_RE.test((inEmail.value||"").trim()))return true;
  errBox.textContent="這個 email 看起來怪怪的，再檢查一下。";
  try{inEmail.focus();}catch(e){}
  return false;
}
function nextStep(){
  if(step===1&&!emailOk())return;
  if(step<3)goStep(step+1);
}
function sendForm(ok){
  if(sending)return;
  if(!EMAIL_RE.test((inEmail.value||"").trim())){goStep(1);emailOk();return;}
  if(!FORM)return;
  sending=true;
  var btns=steps[3].querySelectorAll("button");
  for(var i=0;i<btns.length;i++)btns[i].disabled=true;

  var body=new URLSearchParams();
  body.append(FORM.email,(inEmail.value||"").trim());
  if(FORM.name) body.append(FORM.name,(inName.value||"").trim());
  if(FORM.ok)   body.append(FORM.ok,ok?"是":"否");
  if(FORM.score)body.append(FORM.score,String(RESULT?RESULT.s:""));
  if(FORM.grade)body.append(FORM.grade,RESULT?RESULT.g.g.replace(/\s/g,""):"");
  if(FORM.code) body.append(FORM.code,myCode);

  /* no-cors：送得出去但讀不到結果，所以一律當成成功。
     Google 表單不送 CORS 標頭，這是唯一能在沒有後端的情況下投件的方式。 */
  fetch(FORM.action,{method:"POST",mode:"no-cors",body:body})["catch"](function(){});
  try{localStorage.setItem("mbh_mail","1");}catch(_){}
  setTimeout(function(){
    sending=false;
    for(var i=0;i<btns.length;i++)btns[i].disabled=false;
    goStep(4);
    mailBtn.classList.remove("show");
  },400);
}

mailBtn.addEventListener("click",openForm);
subForm.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest("button[data-act]");
  if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="next")nextStep();
  else if(act==="back")goStep(Math.max(0,step-1));
  else if(act==="yes")sendForm(true);
  else if(act==="no")sendForm(false);
  else if(act==="skip"||act==="close")closeForm();
});
/* 手機鍵盤上的「下一步／前往」會送出 Enter */
subForm.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.preventDefault();nextStep();}
});
subForm.addEventListener("submit",function(e){e.preventDefault();});

/* ════════ 背景音樂 ════════ */
/* 瀏覽器不准無使用者動作就出聲，所以綁在第一次按鍵或觸碰（標題畫面一定會按） */
var bgm=document.getElementById("bgm"),muteBtn=document.getElementById("mute");
var muted=false;
try{muted=localStorage.getItem("mbh_mute")==="1";}catch(e){}
bgm.volume=.55;bgm.muted=muted;
function paintMute(){
  muteBtn.setAttribute("aria-pressed",muted?"true":"false");
  muteBtn.textContent=muted?"♪ 靜音":"♪ 音樂";
}
function startBgm(){
  if(!bgm.paused)return;
  var p=bgm.play();
  if(p&&p["catch"])p["catch"](function(){});
}
/* 對戰時轉 2 倍速。關掉變調補償，讓它像卡帶快轉一樣連音高一起上去 */
var bgmRate=1;
function setBgmRate(r){
  if(!bgm||bgmRate===r)return;
  bgmRate=r;
  try{
    bgm.preservesPitch=false;
    bgm.mozPreservesPitch=false;
    bgm.webkitPreservesPitch=false;
    bgm.playbackRate=r;
  }catch(e){}
}
paintMute();
addEventListener("pointerdown",startBgm,true);
addEventListener("keydown",startBgm,true);
muteBtn.addEventListener("click",function(e){
  e.stopPropagation();
  muted=!muted;bgm.muted=muted;
  try{localStorage.setItem("mbh_mute",muted?"1":"0");}catch(_){}
  paintMute();startBgm();
});

/* 熱更新 */

              started:(mode!=="title"&&mode!=="intro")};

}catch(e){}
function boot(d){
  if(d&&d.found){
