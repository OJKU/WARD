<title>模範病院稽查</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap">
<style>
  :root{
    --room:#23261f;
    --shell:#cec8b6;
    --shell-hi:#e3ddcc;
    --shell-lo:#a9a390;
    --shell-edge:#7e7866;
    --plate:#8d2f28;
    --ink:#2a281f;
    --btn-a:#7e3430;
    --btn-b:#474a44;
    --btn-lo:#31332e;
    --bezel:#2c3028;
    --led:#c4453a;
    --screen-on:#1b1725;
  }
  html,body{height:100%;}
  body{
    margin:0;background:
      radial-gradient(120% 80% at 50% 0%, #34382e 0%, var(--room) 60%, #16180f 100%);
    color:var(--shell-hi);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:8px 10px;box-sizing:border-box;
    overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  }
  *{-webkit-tap-highlight-color:transparent;}

  /* 機身 9:16 貼合手機；螢幕另外維持 4:3 */
  .cab{
    container-type:inline-size;
    width:min(100%,430px,calc((100vh - 18px) * 0.5625));
    width:min(100%,430px,calc((100svh - 18px) * 0.5625));
    aspect-ratio:9/16;
    display:flex;flex-direction:column;gap:2cqw;
    box-sizing:border-box;
    padding:clamp(9px,3.4vw,15px) clamp(9px,3.4vw,15px) clamp(11px,4vw,18px);
    background:linear-gradient(168deg,var(--shell-hi) 0%,var(--shell) 30%,var(--shell-lo) 100%);
    border-radius:4cqw 4cqw 13cqw 4cqw;
    border:1px solid var(--shell-edge);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.75),
      inset 0 -3px 6px rgba(0,0,0,.22),
      0 18px 34px rgba(0,0,0,.5);
  }

  .plate{
    display:flex;align-items:center;gap:2cqw;flex:0 0 auto;
    font-size:2.5cqw;letter-spacing:.14em;color:var(--ink);opacity:.85;
  }
  .plate .tag{
    background:var(--plate);color:#f3e7dc;
    padding:.6cqw 1.6cqw;border-radius:2px;letter-spacing:.2em;font-weight:700;
  }
  .plate .rule{flex:1;height:1px;background:var(--shell-edge);opacity:.5;}

  .screenbox{
    position:relative;flex:0 0 auto;
    background:linear-gradient(180deg,#333729,#22261c);
    border-radius:2.5cqw 2.5cqw 6cqw 2.5cqw;
    padding:4cqw 3.6cqw 6.2cqw;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.4);
  }
  .screenbox .mark{
    position:absolute;left:3.8cqw;bottom:1.6cqw;
    font-size:2cqw;letter-spacing:.24em;color:#8d9482;
  }
  .screenbox .led{
    position:absolute;right:3.8cqw;bottom:1.9cqw;width:1.6cqw;height:1.6cqw;border-radius:50%;
    background:var(--led);box-shadow:0 0 6px 1px rgba(196,69,58,.8);
  }
  .silk{
    flex:0 0 auto;text-align:center;
    font-size:2.2cqw;letter-spacing:.22em;color:var(--ink);opacity:.45;
  }

  .screen{
    position:relative;aspect-ratio:4/3;width:100%;
    background:var(--screen-on);border-radius:2px;overflow:hidden;
    box-shadow:inset 0 0 12px rgba(25,35,27,.45);
  }
  .screen canvas{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    image-rendering:pixelated;image-rendering:crisp-edges;
  }
  .screen .scan{
    position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(to bottom,rgba(12,9,22,.16) 0 1px,transparent 1px 3px);
    opacity:.4;
  }

  /* 單色螢幕上唯一的紅：印泥 */
  .stamp{
    position:absolute;z-index:4;right:5%;bottom:5%;
    width:26%;aspect-ratio:1;border-radius:50%;
    display:none;place-items:center;
    color:#a5312a;border:3px double #a5312a;
    font-weight:900;letter-spacing:.06em;line-height:1.15;text-align:center;
    font-size:clamp(10px,2.9vw,14px);
    transform:rotate(-13deg);opacity:.88;mix-blend-mode:multiply;
  }
  .stamp.show{display:grid;animation:slam .42s cubic-bezier(.2,1.5,.4,1) both;}
  .stamp b{display:block;font-size:.72em;letter-spacing:.24em;font-weight:700;opacity:.8;}
  @keyframes slam{
    0%{transform:rotate(-30deg) scale(2.6);opacity:0;}
    70%{transform:rotate(-11deg) scale(.94);opacity:.95;}
    100%{transform:rotate(-13deg) scale(1);opacity:.88;}
  }
  @media (prefers-reduced-motion:reduce){ .stamp.show{animation:none;} }

  .ctrl{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;}
  .pad{display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:0 1cqw;}
  .dpad{display:grid;grid-template-columns:repeat(3,11cqw);grid-template-rows:repeat(3,11cqw);}
  .key{
    border:0;padding:0;margin:0;touch-action:none;cursor:pointer;
    background:linear-gradient(170deg,#4d5049,#2b2d28);
    color:#cdc8b8;font-size:3.2cqw;display:grid;place-items:center;
    box-shadow:0 2px 0 var(--btn-lo),0 3px 5px rgba(0,0,0,.35);
  }
  .key.on{transform:translateY(2px);box-shadow:0 0 0 var(--btn-lo),0 1px 3px rgba(0,0,0,.4);filter:brightness(1.2);}
  .dpad .key{width:11cqw;height:11cqw;}
  .dpad .u{grid-area:1/2;border-radius:1.6cqw 1.6cqw 0 0;}
  .dpad .l{grid-area:2/1;border-radius:1.6cqw 0 0 1.6cqw;}
  .dpad .c{grid-area:2/2;background:#3a3d37;box-shadow:inset 0 0 4px rgba(0,0,0,.6);}
  .dpad .r{grid-area:2/3;border-radius:0 1.6cqw 1.6cqw 0;}
  .dpad .d{grid-area:3/2;border-radius:0 0 1.6cqw 1.6cqw;}

  .ab{display:flex;align-items:center;gap:3.6cqw;transform:rotate(-16deg);}
  .round{width:15cqw;height:15cqw;border-radius:50%;font-size:4.4cqw;font-weight:900;font-family:"Press Start 2P",monospace;}
  .round.a{background:linear-gradient(170deg,#9c4741,var(--btn-a));color:#f0dcd6;box-shadow:0 3px 0 #4e211e,0 4px 7px rgba(0,0,0,.4);}
  .round.b{background:linear-gradient(170deg,#5c605a,var(--btn-b));color:#dcd9cf;box-shadow:0 3px 0 #2a2c28,0 4px 7px rgba(0,0,0,.4);}
  .round.on{transform:translateY(3px);}
  .ab .b{margin-top:5cqw;}

  .sys{display:flex;justify-content:center;gap:5cqw;}
  .pill{
    width:19cqw;height:4.6cqw;border-radius:2.6cqw;transform:rotate(-16deg);
    font-size:2.3cqw;letter-spacing:.16em;font-weight:700;color:#d6d2c6;
  }

  .grille{display:flex;gap:2.2cqw;justify-content:flex-end;padding-right:3cqw;transform:rotate(-24deg);transform-origin:right center;}
  .grille i{
    display:block;width:1.5cqw;height:10cqw;border-radius:1cqw;
    background:linear-gradient(180deg,#a49e8c,#bdb7a5);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.45),0 1px 0 rgba(255,255,255,.5);
  }

  .foot{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:2cqw;
    font-size:2.4cqw;letter-spacing:.1em;color:var(--ink);opacity:.72;min-height:5cqw;
  }
  .share{
    border:1px solid var(--shell-edge);background:rgba(255,255,255,.35);
    color:var(--ink);font-family:inherit;font-size:2.5cqw;letter-spacing:.1em;
    padding:1cqw 2.4cqw;border-radius:3px;cursor:pointer;display:none;
  }
  .share.show{display:block;}
  .share:active{background:rgba(255,255,255,.6);}
  .snd{
    border:1px solid var(--shell-edge);background:rgba(255,255,255,.35);
    color:var(--ink);font-family:inherit;font-size:2.5cqw;letter-spacing:.1em;
    padding:1cqw 2.4cqw;border-radius:3px;cursor:pointer;flex:0 0 auto;
  }
  .snd[aria-pressed="true"]{opacity:.45;}
  .snd:active{background:rgba(255,255,255,.6);}
  .foot .cap{flex:1;text-align:center;}
  .key:focus-visible,.share:focus-visible,.snd:focus-visible{outline:2px solid #d8b24a;outline-offset:2px;}
</style>

<div class="cab">
  <div class="plate">
    <span class="tag">臺灣省衛生處</span>
    <span class="rule"></span>
    <span>病院稽查機　59-A</span>
  </div>

  <div class="screenbox">
    <div class="screen">
      <canvas id="cv" width="256" height="192" aria-label="模範病院稽查遊戲畫面"></canvas>
      <div class="scan"></div>
      <div class="stamp" id="stamp"></div>
    </div>
    <span class="mark">MEIHAN&nbsp;OPTICAL&nbsp;LCD</span>
    <span class="led"></span>
  </div>

  <div class="silk">本機事證紀錄依病院評鑑辦法第七條辦理</div>

  <div class="ctrl">
    <div class="pad">
      <div class="dpad">
        <button class="key u" data-k="up" aria-label="上">▲</button>
        <button class="key l" data-k="left" aria-label="左">◀</button>
        <div class="key c" aria-hidden="true"></div>
        <button class="key r" data-k="right" aria-label="右">▶</button>
        <button class="key d" data-k="down" aria-label="下">▼</button>
      </div>
      <div class="ab">
        <button class="key round b" data-k="b" aria-label="B 取消">B</button>
        <button class="key round a" data-k="a" aria-label="A 確認">A</button>
      </div>
    </div>

    <div class="sys">
      <button class="key pill" data-k="select" aria-label="SELECT 推薦碼">SELECT</button>
      <button class="key pill" data-k="start" aria-label="START 稽查手冊">START</button>
    </div>

    <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="foot">
    <button class="snd" id="mute" aria-pressed="false" aria-label="背景音樂開關">♪ 音樂</button>
    <span class="cap">《昨日病房》外傳</span>
    <button class="share" id="share">分享稽查結果</button>
  </div>
</div>

<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

<script>
(function(){
"use strict";

/* ════════ 畫布與基本繪圖 ════════ */
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var W=256,H=192;
ctx.imageSmoothingEnabled=false;
/* ════════ 調色盤（gather.town 風：飽和色塊＋深色描邊） ════════ */
var K={
  out   :"#2f2a3a", ink  :"#1b1725", soft :"#6d6880",
  wall  :"#8fb8a8", wallL:"#a9cbbe", wallD:"#628b7d", rail :"#4e7368",
  wood  :"#b07a45", woodD:"#7d5230", woodL:"#c9955c", seam :"#946139",
  lino  :"#cfd8cd", linoB:"#c2ccc1", linoS:"#aab5a9",
  terra :"#e4e0d4", terraB:"#d7d2c3", terraS:"#bbb5a4",
  cream :"#f6f1e4", creamD:"#ded5c0",
  white :"#ffffff",
  metal :"#a7b0ba", metalD:"#727c88",
  red   :"#c4493d", redD  :"#8d2f28",
  blue  :"#4d7cb0", blueD :"#33567d",
  gold  :"#e2b551", goldD :"#b3872f",
  leaf  :"#5f9e5a", leafD :"#3f7340",
  pink  :"#e39aa1",
  glass :"#bcd9e0", glassD:"#8fb4bf",
  paper :"#f2ead6", paperD:"#d9cdb0",
  night :"#2a2536"
};
/* 舊繪圖碼的四階備援（淺→深），避免任何漏網的地方變成純黑 */
var P=[K.cream,K.creamD,K.soft,K.ink];

var FT ='700 12px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
var FTS='700 10px "Noto Sans TC","PingFang TC",sans-serif';
var FTB='900 19px "Noto Sans TC","PingFang TC",sans-serif';
var FTP='8px "Press Start 2P",monospace';

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function box(x,y,w,h,fill,line){px(x,y,w,h,line);px(x+1,y+1,w-2,h-2,fill);}
/* gather 的家具都是「亮面＋暗面＋深色描邊」三件套 */
function obj(x,y,w,h,fill,dark){
  px(x,y,w,h,K.out);
  px(x+1,y+1,w-2,h-2,fill);
  if(dark)px(x+1,y+h-3,w-2,2,dark);
}
function shade(x,y,w,h,a){
  ctx.globalAlpha=a||.16;px(x,y,w,h,"#000");ctx.globalAlpha=1;
}
/* 圓角白底面板，UI 用 */
function panel(x,y,w,h,fill,line){
  fill=fill||K.cream;line=line||K.out;
  px(x+2,y,w-4,h,line);px(x,y+2,w,h-4,line);
  px(x+3,y+1,w-6,h-2,fill);px(x+1,y+3,w-2,h-6,fill);
}
function txt(s,x,y,c,f,al){ctx.font=f||FT;ctx.fillStyle=c;ctx.textAlign=al||"left";ctx.textBaseline="alphabetic";ctx.fillText(s,x,y);ctx.textAlign="left";}
function tw(s,f){ctx.font=f||FT;return ctx.measureText(s).width;}
function wrap(s,max,f){
  ctx.font=f||FT;var out=[],cur="";
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch==="\n"){out.push(cur);cur="";continue;}
    if(ctx.measureText(cur+ch).width>max&&cur){out.push(cur);cur="";}
    cur+=ch;
  }
  if(cur||!out.length)out.push(cur);return out;
}

/* ════════ 人物像素圖 ════════ */
/* 大頭小身、深色描邊，12×16。色號：
   0 描邊　1 膚色　2 頭髮／帽　3 眼睛　4 上衣　5 配件　6 褲　7 白　8 鞋　9 重點色 */
var SPR={
  you:{c:[K.out,"#f0c9a4","#33507a",K.night,"#c9a86a","#a8894f","#3f4a63",K.cream,K.out,K.red],
   r:["...222222...","..22222222..","..22222222..","..00000000..",
      "...111111...","...131131...","...111111...","...111111...",
      "....7777....","..44444444..",".4444444444.",".4414444144.",
      ".4444444444.","..66666666..","..666..666..","..888..888.."]},
  youback:{c:[K.out,"#f0c9a4","#33507a",K.night,"#c9a86a","#a8894f","#3f4a63",K.cream,K.out,K.red],
   r:["...222222...","..22222222..","..22222222..","..22222222..",
      "...222222...","...222222...","...222222...","....2222....",
      "....7777....","..44444444..",".4444444444.",".4414444144.",
      ".4444444444.","..66666666..","..666..666..","..888..888.."]},
  doc:{c:[K.out,"#f0c9a4","#b9b3ab",K.night,K.cream,"#5c6672","#4a4a55",K.cream,K.out,K.redD],
   r:["...222222...","..22222222..","..22222222..","...111111...",
      "..55555555..","...131131...","...111111...","....1111....",
      "...444444...","..44444444..",".4449994444.",".4419994144.",
      ".4449994444.","..66666666..","..666..666..","..888..888.."]},
  nur:{c:[K.out,"#f0c9a4","#3a2e2a",K.night,"#f7f7f4","#8fb4bf","#4a4a55",K.white,K.out,K.pink],
   r:["...777777...","..77777777..","..22222222..","...111111...",
      "...131131...","...111111...","....1111....","...999999...",
      "..44444444..",".4444444444.",".4414444144.",".4444444444.",
      "..44444444..","..44444444..","..111..111..","..888..888.."]},
  popo:{c:[K.out,"#f0c9a4","#7a5a3c",K.night,"#bcd4e8","#9bb8d0","#8fa6bd",K.white,K.out,"#7fc98f"],
   r:["...222222...","..22222222..",".2222222222.","..21111112..",
      "...131131...","...111111...","....1111....","...444444...",
      "..44444444..",".4444444444.",".4414444144.",".4494444944.",
      "..44444444..","..444..444..","..111..111..","..888..888.."]}
};
function sprite(name,cx,fy,flip,bob,sc){
  sc=sc||1;
  var S=SPR[name],a=S.r,pal=S.c,rows=a.length,w=a[0].length;
  var x0=Math.round(cx-w*sc/2),y0=Math.round(fy-rows*sc)+(bob||0)*sc;
  shade(x0+sc,fy-sc*1.5,(w-2)*sc,sc*2,.2);
  for(var r=0;r<rows;r++){
    var row=a[r];
    for(var c=0;c<w;c++){
      var ch=row[c];if(ch===".")continue;
      var cc=flip?(w-1-c):c;
      px(x0+cc*sc,y0+r*sc,sc,sc,pal[+ch]);
    }
  }
}

/* ════════ 三十件可調查物品 ════════ */
/* ph = 章節；d = 調查前的初步觀察；t = 事證內容 */
var CLUES=[
/*<<<主線開始 這一段由 update-clues.ps1 從 Google 試算表產生，不要手改>>>*/

 {id:"band", ph:1,room:"clinic", n:"昨日之光手環", cat:"醫療設備",s:+3,key:1,

function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i,ch;
  text=text.replace(/^﻿/,"");
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    if(q){
      if(ch==='"'){ if(text.charAt(i+1)==='"'){cur+='"';i++;} else q=false; }
      else cur+=ch;
    }
    else if(ch==='"')q=true;
    else if(ch===",")  {row.push(cur);cur="";}
    else if(ch==="\n") {row.push(cur);rows.push(row);row=[];cur="";}
    else if(ch!=="\r") cur+=ch;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row);}
  return rows.filter(function(r){
    return r.some(function(c){return c!=="";});
  });
}

function applySheet(text){
  var rows=parseCSV(text);
  if(rows.length<2)return false;
  var head=rows[0].map(function(s){return s.trim();});
  var col={};
  head.forEach(function(h,i){col[h]=i;});
  var need=["代號","名稱","敘述","分數"];
  for(var k=0;k<need.length;k++)if(col[need[k]]===undefined)return false;

  var want=CLUES.filter(function(c){return !c.bonus;}).length;
  var body=rows.slice(1);
  if(body.length!==want)return false;

  var seen={},staged=[],keyPerPhase={},i,r,id,c,s;
  for(i=0;i<body.length;i++){
    r=body[i];
    id=(r[col["代號"]]||"").trim();
    c=CLUE[id];
    if(!c||c.bonus||seen[id])return false;      /* 不認識、或重複 */
    seen[id]=1;
    s=Number((r[col["分數"]]||"").trim());
    if(!isFinite(s)||s===0||s!==Math.round(s))return false;
    var isKey=/^[YyＹ1]/.test((r[col["關鍵標的"]]!==undefined?r[col["關鍵標的"]]:"")||"");
    if(isKey)keyPerPhase[c.ph]=(keyPerPhase[c.ph]||0)+1;
    staged.push({c:c,r:r,s:s,key:isKey});
  }
  /* 每一章都必須剛好有一件關鍵標的，否則角色不會出現、遊戲會卡死 */
  for(i=0;i<6;i++)if(keyPerPhase[i]!==1)return false;

  var un=function(v){return (v||"").replace(/\\n/g,"\n");};
  staged.forEach(function(x){
    var r=x.r,c=x.c;
    c.n=(r[col["名稱"]]||c.n).trim();
    c.t=un(r[col["敘述"]])||c.t;
    c.s=x.s;
    c.key=x.key?1:0;
    if(col["初步觀察"]!==undefined&&r[col["初步觀察"]])c.d=un(r[col["初步觀察"]]);
    if(col["評鑑項目"]!==undefined&&r[col["評鑑項目"]])c.cat=r[col["評鑑項目"]].trim();
    if(col["限閱"]!==undefined)c.lock=/^[YyＹ1]/.test(r[col["限閱"]]||"")?1:0;
  });
  return true;
}

/* 把一份線上 CSV 抓回來。done() 不管成功失敗都只會被叫一次，開場才不會卡住。 */
function grabCSV(url,ok){
  var done=false;
  var finish=function(){if(done)return;done=true;booting--;};
  if(typeof fetch!=="function"){finish();return;}
  setTimeout(finish,8000);                    /* 網路太慢就先讓玩家進遊戲 */
  try{
    fetch(url+"&_="+Date.now(),{mode:"cors",credentials:"omit",cache:"no-store"})
      .then(function(r){return r.ok?r.text():null;})
      .then(function(t){
        if(!done&&t){try{ok(t);}catch(e){}}
        finish();
      })["catch"](finish);
  }catch(e){finish();}
}

var CODEBITS=(function(){
  var bin,a,i,n;
  try{bin=atob(CODEB64);}catch(e){return null;}
  n=bin.length;a=new Uint8Array(n);

/* 線上名單（試算表第一個分頁）。抓得到就以它為準，抓不到才用上面烤進來的點陣圖。
   這樣使用者在試算表裡加一批新碼，玩家重新整理就能用，不必重新部署。 */
var CODELIVE=null;
function applyCodes(text){
  var rows=parseCSV(text);
  if(rows.length<2)return false;
  var list=[],seen={},i,v;
  for(i=1;i<rows.length;i++){
    v=(rows[i][0]||"").trim();
    if(!/^\d{5}$/.test(v)||seen[v])continue;
    seen[v]=1;list.push(v);
  }
  if(list.length<100)return false;   /* 名單明顯壞掉（或抓到登入頁）就不要用 */
  CODELIVE={set:seen,list:list};
  /* 玩家手上那組如果已經不在新名單裡，換一組給他 */
  if(myCode&&myCode!==MASTER&&!seen[myCode]){
    myCode=pickCode();
    try{localStorage.setItem("mbh_code5",myCode);}catch(e){}
  }
  return true;
}

var MASTER="54080";           /* 通用預設推薦碼，刻意不在名單內 */
function isCode(v){
  if(!/^\d{5}$/.test(v))return false;
  if(v===MASTER)return true;
  if(CODELIVE)return !!CODELIVE.set[v];
  if(!CODEBITS)return true;   /* 點陣圖壞了就不要擋人 */
  var i=+v-10000;
  return i>=0&&i<90000&&!!(CODEBITS[i>>3]>>(i&7)&1);
}
function pickCode(){         /* 從名單裡發一組給這位玩家 */
  if(CODELIVE)return CODELIVE.list[Math.floor(Math.random()*CODELIVE.list.length)];
  if(!CODEBITS)return String(10000+Math.floor(Math.random()*90000));
  var i=Math.floor(Math.random()*90000),k,j;
  for(k=0;k<90000;k++){
    j=(i+k)%90000;
    if(CODEBITS[j>>3]>>(j&7)&1)return String(j+10000);
  }
  return MASTER;
}
function genCode(){
  var c;try{c=localStorage.getItem("mbh_code5");}catch(e){}
  if(!c||c===MASTER||!isCode(c)){   /* 舊版隨機碼不在名單內，換一組 */
    c=pickCode();
    try{localStorage.setItem("mbh_code5",c);}catch(e){}
  }
  return c;
}
myCode=genCode();

Array.prototype.forEach.call(document.querySelectorAll("[data-k]"),function(el){
  var k=el.dataset.k;el.style.touchAction="none";
  var on=function(e){e.preventDefault();down(k);el.classList.add("on");
    if(el.setPointerCapture&&e.pointerId!=null){try{el.setPointerCapture(e.pointerId);}catch(_){}}};
  var off=function(e){e.preventDefault();up(k);el.classList.remove("on");};
  el.addEventListener("pointerdown",on);
  el.addEventListener("pointerup",off);
  el.addEventListener("pointercancel",off);
  el.addEventListener("lostpointercapture",off);
  el.addEventListener("contextmenu",function(e){e.preventDefault();});
});

/* ── 調查流程：先說明，再決定查不查 ── */
function approach(id){
  var c=CLUE[id];
  if(has(id)){say("事證",["【"+c.n+"】\n這一項你已經記錄過了。"]);return;}
  var pages=[c.d
    +(hinted[id]?"\n（有人提過：這一項"+(hinted[id]==="+"?"加分":"扣分")+"。）":"")
    +(resolved[id]?"\n（你剛才略過了它。）":"")];
  if(c.key)pages.push("※ 關鍵標的\n一經調查，院方就會察覺，\n並把你帶往下一個區域。\n（這裡之後還能自己走回來。）");
  say(c.key?"初步觀察　※關鍵":"初步觀察",pages,function(){
    openMenu(c.key?"要動它嗎？":"要調查嗎？",[
      {label:"調查",fn:function(){investigate(id);}},
      {label:"先不查",fn:function(){skipClue(id);}}

}
function skipClue(id){

function activeProps(){

function activeZone(){

  var ap=activeProps();

  return null;

function blocked(x,y){
  var r=ROOMS[room],s=r.solids||[],i;
  for(i=0;i<s.length;i++){var b=s[i];if(x>b[0]&&x<b[0]+b[2]&&y>b[1]&&y<b[1]+b[3])return true;}
  var ap=activeProps();
  for(i=0;i<ap.length;i++){
    var sb=ap[i].p.solid;
    if(sb&&x>sb[0]&&x<sb[0]+sb[2]&&y>sb[1]&&y<sb[1]+sb[3])return true;
  }
  return false;
}

function startBattle(){
  var pool=found.filter(function(id){return !CLUE[id].bonus;});
  bt={stage:"intro",round:0,max:Math.min(3,pool.length),given:[],sum:0,mood:50,
      msg:["有人從走廊衝了進來！",
           "「那是我的兔子！」\n「……你是新來的嗎？\n　我是波波！」",
           "「你查到什麼了？」\n「給我看好不好——」"],mi:0,mc:0,
      pick:{idx:0}};
  if(pool.length===0){
    bt.msg=["有人從走廊衝了進來！",
            "「那是我的兔子！」\n「你查到什麼了？」",
            "你什麼都拿不出來。\n波波的耳朵垂了下來。"];
    bt.stage="empty";
  }
  mode="battle";
}
function battlePool(){
  return found.filter(function(id){
    return !CLUE[id].bonus&&bt.given.indexOf(id)<0;
  });
}
function btSay(pages,next){bt.msg=pages;bt.mi=0;bt.mc=0;bt.stage=next;}
function btGive(id){
  var c=CLUE[id];
  bt.given.push(id);bt.sum+=c.s;
  bt.mood=Math.max(0,Math.min(100,bt.mood+c.s*4));
  var lines=SPECIAL[id]||(c.s>0?POSR[bt.round%POSR.length]:NEGR[bt.round%NEGR.length]);
  var pages=["你把「"+c.n+"」給波波看。"].concat(lines);
  bt.round++;
  btSay(pages,"react");
}
function btReward(){
  var gid = bt.sum>=6?"gift_a":(bt.sum<=-6?"gift_c":"gift_b");
  var lead = bt.sum>=6
    ? ["波波笑得眼睛都瞇起來了。","「你是好人耶。」\n「我也要給你一個東西。」"]
    : (bt.sum<=-6
      ? ["波波安靜了很久。","「……你都知道了。」\n「那我跟你說一件事，」\n「你不要跟他們講。」"]
      : ["波波歪著頭想了一下。","「嗯——」\n「那我告訴你一件事好了。」"]);
  bt.gid=gid;
  btSay(lead,"reward");
}

/* ════════ 更新 ════════ */
function update(){
  blink++;
  /* 對戰時音樂加速；不管對戰從哪個出口結束都會自己恢復 */
  setBgmRate(mode==="battle"?2:1);
  if(mode==="play")elapsed=(Date.now()-t0)/1000;

  if(mode==="title"){if(booting<=0&&(just.start||just.a)){mode="intro";intro={i:0};}return;}

  if(mode==="intro"){
    if(just.a||just.start){intro.i++;if(intro.i>=INTRO.length)startGame();}
    if(just.b&&intro.i>0)intro.i--;
    return;
  }

  if(mode==="dialog"){
    var pg=dlg.pages[dlg.i];
    if(dlg.chars<pg.length)dlg.chars+=2;
    if(just.a||just.start){
      if(dlg.chars<pg.length)dlg.chars=pg.length;
      else{
        dlg.i++;
        if(dlg.i>=dlg.pages.length){var f=dlg.then;dlg=null;mode="play";if(f)f();}
        else dlg.chars=0;
      }
    }
    return;
  }

  if(mode==="menu"){
    if(just.up)menu.idx=(menu.idx+menu.items.length-1)%menu.items.length;
    if(just.down)menu.idx=(menu.idx+1)%menu.items.length;
    if(just.a){var it=menu.items[menu.idx];menu=null;it.fn();return;}
    if(just.b){var cf=menu.cancel;menu=null;if(cf)cf();else mode=book?"book":"play";}
    return;
  }

  if(mode==="code"){
    if(just.left)codeUI.pos=(codeUI.pos+4)%5;
    if(just.right)codeUI.pos=(codeUI.pos+1)%5;
    if(just.up)codeUI.digits[codeUI.pos]=(codeUI.digits[codeUI.pos]+1)%10;
    if(just.down)codeUI.digits[codeUI.pos]=(codeUI.digits[codeUI.pos]+9)%10;
    if(just.b){var f2=codeUI.then;codeUI=null;f2(false);}
    if(just.a){
      var v=codeUI.digits.join("");
      if(v===myCode){codeUI.msg="不可使用自己的推薦碼。";}
      else if(!isCode(v)){codeUI.msg="查無此推薦碼，請再確認。";}
      else{var f3=codeUI.then;codeUI=null;
        say("複核",["推薦碼 "+v+" 複核通過。\n限閱卷宗已解鎖。"],function(){f3(true);});}
    }
    return;
  }

  if(mode==="book"){
    var total=found.length+2;
    if(just.up)book.idx=(book.idx+total-1)%total;
    if(just.down)book.idx=(book.idx+1)%total;
    if(just.start||just.b){book=null;mode="play";}
    if(just.a){
      if(book.idx<found.length){entry={i:book.idx};mode="entry";}
      else if(book.idx===found.length){
        openMenu("提交評分表？",[
          {label:"確定提交",fn:function(){book=null;finish();}},
          {label:"再看一次手冊",fn:function(){mode="book";}}
        ]);
      }else{book=null;mode="play";}
    }
    return;
  }

  if(mode==="entry"){
    if(found.length>1){
      if(just.left)entry.i=(entry.i+found.length-1)%found.length;
      if(just.right)entry.i=(entry.i+1)%found.length;
    }
    if(just.a||just.b||just.start){book.idx=entry.i;entry=null;mode="book";}
    return;
  }

  if(mode==="battle"){
    if(bt.stage==="pick"){
      var pool=battlePool();
      if(just.up)bt.pick.idx=(bt.pick.idx+pool.length-1)%pool.length;
      if(just.down)bt.pick.idx=(bt.pick.idx+1)%pool.length;
      if(just.a)btGive(pool[bt.pick.idx]);
      return;
    }
    var m=bt.msg[bt.mi];
    if(bt.mc<m.length)bt.mc+=2;
    if(just.a||just.start){
      if(bt.mc<m.length){bt.mc=m.length;return;}
      bt.mi++;
      if(bt.mi<bt.msg.length){bt.mc=0;return;}
      if(bt.stage==="intro"){bt.pick.idx=0;bt.stage="pick";return;}
      if(bt.stage==="react"){
        if(bt.round>=bt.max)btReward();
        else{bt.pick.idx=0;bt.stage="pick";}
        return;
      }
      if(bt.stage==="empty"){bt=null;mode="play";
        phase++;room=PHASES[3].after.go;opened[room]=1;pl.x=128;pl.y=108;
        applyHints(PHASES[3].after);
        say("548 波波",POPO_HINT,function(){
          say("",["——　"+ROOMS[room].name+"　已解鎖　——"]);
        });return;}
      if(bt.stage==="reward"){btEnd();return;}
    }
    return;
  }

  if(mode==="result"){if(just.a||just.start)location.reload();return;}

  /* ── play ── */
  if(just.start){book={idx:found.length};mode="book";return;}
  if(just.select){say("推薦碼",["你的稽查員推薦碼：\n　　　"+myCode+
    "\n把它給別人，別人就能\n複核他那邊的限閱卷宗。"]);return;}

  var sp=(held.b?1.9:1.2),dx=0,dy=0;
  if(held.left){dx-=sp;pl.face=-1;}
  if(held.right){dx+=sp;pl.face=1;}
  if(held.up)dy-=sp;
  if(held.down)dy+=sp;
  pl.walking=!!(dx||dy);
  if(pl.walking)pl.step+=0.18;
  var nx=Math.max(WALK.x0,Math.min(WALK.x1,pl.x+dx));
  var ny=Math.max(WALK.y0,Math.min(WALK.y1,pl.y+dy));
  if(!blocked(nx,pl.y))pl.x=nx;
  if(!blocked(pl.x,ny))pl.y=ny;

  if(just.a){
    var z=activeZone();
    if(z){
      if(z.go){
        if(!opened[z.go]){
          say("門",["門鎖著。\n未經院方人員帶領，\n稽查員不得進入。"]);
        }else{
          var from=room;room=z.go;
          if(room==="hall"){pl.x=HALLBACK[from]!==undefined?HALLBACK[from]:128;pl.y=114;}
          else{pl.x=128;pl.y=108;}
        }
      }
      else if(z.clue)approach(z.clue);
    }
  }
}

/* ── 評分表 ── */
var RESULT=null,N_END=5;
function grade(s){
  if(s>=90)return{i:0,g:"特　優",st:"合　格",c:["各項指標俱優，環境、藥政、","文書均臻完善，堪為表率。"]};
  if(s>=75)return{i:1,g:"甲　等",st:"合　格",c:["管理大致完善，瑕不掩瑜，","准予列入模範病院名錄。"]};
  if(s>=60)return{i:2,g:"乙　等",st:"有條件",c:["部分項目尚待補正，限期三","個月改善後複查始予列名。"]};
  if(s>=45)return{i:3,g:"丙　等",st:"不合格",c:["事證顯示本院管理存疑慮，","病人處遇一節尤待說明。"]};
  return{i:4,g:"丁　等",st:"不合格",c:["卷宗殘缺、處遇失當，情節","重大。建請上級即刻複查。"]};
}
function seenEndings(){try{return localStorage.getItem("mbh_end")||"";}catch(e){return "";}}
function markEnding(i){
  var s=seenEndings();
  if(s.indexOf(String(i))<0){s+=String(i);try{localStorage.setItem("mbh_end",s);}catch(e){}}
  return s;
}
function fmtTime(){var m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);return m+" 分 "+(s<10?"0":"")+s+" 秒";}
function finish(){
  var s=score(),g=grade(s);
  RESULT={s:s,g:g,n:nMain(),sk:nSkip(),seen:markEnding(g.i)};
  mode="result";
  var el=document.getElementById("stamp");
  el.innerHTML="<span>"+g.st+"<b>衛生處</b></span>";
  el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
  document.getElementById("share").classList.add("show");
}
function drawResult(){
  px(0,0,W,H,K.wall);
  for(var g=0;g<H;g+=6)shade(0,g,W,1,.06);
  shade(11,10,240,170,.22);
  panel(8,6,240,170,K.paper);
  px(14,12,228,2,K.redD);px(14,16,228,1,K.redD);
  txt("模範病院評分表",128,38,K.ink,'900 17px "Noto Sans TC",sans-serif',"center");
  txt("臺灣省衛生處　第 059 號",128,53,K.soft,FTS,"center");
  px(20,60,216,1,K.paperD);
  txt("受檢單位",22,76,K.soft,FTS);txt("明日之家",78,76,K.ink,FTS);
  txt("稽查時間　"+fmtTime(),236,76,K.soft,FTS,"right");
  txt("事證",22,92,K.soft,FTS);
  txt(RESULT.n+" ／ 30　　略過 "+RESULT.sk+" 件",56,92,K.ink,FTS);
  txt("結局",178,92,K.soft,FTS);
  txt(RESULT.seen.length+" ／ "+N_END,206,92,K.ink,FTS);
  for(var e=0;e<N_END;e++){
    var on=RESULT.seen.indexOf(String(e))>=0;
    box(178+e*12,96,9,5,on?K.gold:K.paper,K.paperD);
  }
  px(20,104,216,1,K.paperD);
  txt("總　分",22,115,K.soft,FTS);
  txt(String(RESULT.s),22,142,RESULT.s>=75?K.leafD:(RESULT.s>=60?K.goldD:K.redD),
      '900 20px "Press Start 2P",monospace');
  txt("／100",90,140,K.soft,FTS);
  txt("等　第",130,115,K.soft,FTS);
  txt(RESULT.g.g,130,140,K.ink,'900 15px "Noto Sans TC",sans-serif');
  px(20,148,140,1,K.paperD);
  txt(RESULT.g.c[0],22,162,K.ink,FTS);
  txt(RESULT.g.c[1],22,174,K.ink,FTS);
  if(RESULT.n>=30)txt("＊你看見的，比他們願意給你看的多。",128,188,K.cream,FTS,"center");
  else if(blink%60<40)txt("按 Ａ 重新稽查",128,188,K.cream,FTS,"center");
}

/* ════════ 背景音樂 ════════ */
/* 瀏覽器不准無使用者動作就出聲，所以綁在第一次按鍵或觸碰（標題畫面一定會按） */
var bgm=document.getElementById("bgm"),muteBtn=document.getElementById("mute");
var muted=false;
try{muted=localStorage.getItem("mbh_mute")==="1";}catch(e){}
bgm.volume=.55;bgm.muted=muted;
function paintMute(){
  muteBtn.setAttribute("aria-pressed",muted?"true":"false");
  muteBtn.textContent=muted?"♪ 靜音":"♪ 音樂";
}
function startBgm(){
  if(!bgm.paused)return;
  var p=bgm.play();
  if(p&&p["catch"])p["catch"](function(){});
}
/* 對戰時轉 2 倍速。關掉變調補償，讓它像卡帶快轉一樣連音高一起上去 */
var bgmRate=1;
function setBgmRate(r){
  if(!bgm||bgmRate===r)return;
  bgmRate=r;
  try{
    bgm.preservesPitch=false;
    bgm.mozPreservesPitch=false;
    bgm.webkitPreservesPitch=false;
    bgm.playbackRate=r;
  }catch(e){}
}
paintMute();
addEventListener("pointerdown",startBgm,true);
addEventListener("keydown",startBgm,true);
muteBtn.addEventListener("click",function(e){
  e.stopPropagation();
  muted=!muted;bgm.muted=muted;
  try{localStorage.setItem("mbh_mute",muted?"1":"0");}catch(_){}
  paintMute();startBgm();
});

/* 熱更新 */
try{
  if(window.claude&&window.claude.hot){
    window.claude.hot.snapshot(function(){
      return {room:room,phase:phase,found:found,resolved:resolved,unlocked:unlocked,
              opened:opened,hinted:hinted,x:pl.x,y:pl.y,code:myCode,t0:t0,
              started:(mode!=="title"&&mode!=="intro")};
    });
  }
}catch(e){}
function boot(d){
  if(d&&d.found){
    found=d.found;resolved=d.resolved||{};unlocked=d.unlocked||{};
    opened=d.opened||{hall:1};opened.hall=1;hinted=d.hinted||{};
    room=d.room||"hall";phase=d.phase||0;
    pl.x=d.x||128;pl.y=d.y||150;myCode=d.code||myCode;t0=d.t0||Date.now();
    mode=d.started?"play":"title";
  }
  requestAnimationFrame(frame);
}
try{
  if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);
  else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(e){boot({});}
})();
</script>
